<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent hive</title>
<!-- The hive graph of the cmux Agents panel. The panel opens this page with its data after "#" in the link:
     workspaces, their sessions, and the subagents of each session. Every 15 seconds the page also loads
     hive-data.js, a local file next to it that label-tabs.py writes, and brings the picture up to date.
     A switch at the top changes the view: Hive, Timeline, Cost, Limits, Queue, Context, Inside, Rhythm, Setup. Timeline, Limits,
     Queue and Rhythm also read history-data.js, the local history that label-tabs.py keeps (states, times, costs, samples of context and cost, marks, subagent runs
     and limit figures; no request or reply text).
     It loads nothing from the network. It stores two words in the browser's local storage: the last view and the
     last time range. Every source passes a check (tidy, tidyHistory), and every text goes in with textContent,
     so a session title cannot add markup.
     The title of the page stays "Agent hive" in every view: the panel finds the page by it. -->
<style>
  :root { --bg: #f6f6f7; --fg: #1c1c1e; --dim: #6e6e73; --line: #c7c7cc; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f2f2f7; --dim: #a8a8b0; --line: #48484a; --card: #2c2c2e; } }
  /* The Inside view: two grey tones for tools, and one colour per kind of context content. The kinds are a checked
     categorical set in this order (blue, aqua, violet, magenta, green), one step per mode; they mean nothing about models. */
  :root { --tool: #636366; --tool-ext: #aeaeb2; --cm: #2a78d6; }
  @media (prefers-color-scheme: dark) { :root { --tool: #aeaeb2; --tool-ext: #6e6e73; --cm: #3987e5; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--dim); }
  .wrap { overflow-x: auto; }
  svg text { fill: var(--fg); font: 12px -apple-system, system-ui, sans-serif; }
  svg text.sub { fill: var(--dim); font-size: 10px; }
  svg path { fill: none; stroke: var(--line); stroke-width: 1.2; }
  svg rect.box { fill: var(--card); stroke: var(--line); }
  svg g.here rect.box { stroke: var(--fg); stroke-width: 2; fill: color-mix(in srgb, var(--fg) 9%, var(--card)); }
  svg g.go { cursor: pointer; }
  svg g.go:hover rect.box, svg g.go:focus rect.box { stroke: #0A84FF; stroke-width: 1.6; }
  svg g.go:focus { outline: none; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; }
  nav button, #tools button { font: 600 12px -apple-system, system-ui, sans-serif; color: var(--dim); background: none; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  nav button:hover, #tools button:hover { color: var(--fg); }
  nav button[aria-pressed="true"], #tools button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
  nav button:focus-visible, #tools button:focus-visible { outline: 2px solid #0A84FF; }
  #tools { margin: 0 0 8px; min-height: 0; }
  svg text.big { font-size: 20px; font-weight: 600; }
  svg text.ink { fill: #111114; }
  svg line.grid { stroke: var(--line); stroke-width: 1; }
  svg .lane:hover rect.hit { fill: color-mix(in srgb, var(--fg) 6%, transparent); }
  .legend span { display: inline-block; margin-right: 14px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
</style>
</head>
<body>
<h1 id="head">Agent hive</h1>
<nav id="nav" aria-label="View"></nav>
<p id="when"></p>
<div id="tools"></div>
<p class="legend" id="legend"></p>
<div class="wrap"><svg id="g" xmlns="http://www.w3.org/2000/svg"></svg></div>
<script>
"use strict";
const STATUS = { needs_input: ["#FF9F0A", "needs you"], working: ["#0A84FF", "working"], idle: ["#34C759", "idle"] };
const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs, text) => {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, String(v));
  if (text !== undefined) node.textContent = String(text);
  return node;
};
// One fixed colour per account name: the same list and the same sum as the Agents panel and the status line.
const ACCT_COLORS = ["#5fd7ff", "#af87ff", "#ff87d7", "#00d7af", "#d7d75f", "#5fafff"];
const acctColor = (name) => {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 1000003;
  return ACCT_COLORS[h % ACCT_COLORS.length];
};
const cut = (text, n) => { const s = String(text ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

// Only known keys with the expected type pass. The link and the live file both go through here.
const text = (v, n) => (typeof v === "string" ? v.slice(0, n) : "");
const ident = (v) => (typeof v === "string" && /^[0-9A-Fa-f-]{1,40}$/.test(v) ? v.toUpperCase() : "");
const isCount = (v) => Number.isFinite(v) && v >= 0;
const count = (v) => (isCount(v) ? v : 0);
// A list of [text, value] pairs: at most max of them, the text cut to n characters; a text value is cut to 40.
const pairs = (v, max, n, ok) => (Array.isArray(v) ? v : []).slice(0, max).filter((p) => Array.isArray(p) && p.length === 2 && text(p[0], n) && ok(p[1]))
  .map((p) => [text(p[0], n), typeof p[1] === "string" ? text(p[1], 40) : p[1]]);
// The kinds of content in a context window, in the fixed order of their colours (the order is part of the colour check).
const CM = [["tool results"], ["your messages"], ["replies"], ["thinking"], ["attachments"]];
// What the folder of a workspace holds for its agents, besides its instruction files.
const SETUP = [["skills", "skills"], ["agents", "agents"], ["commands", "commands"], ["rules", "rules"], ["hooks", "hooks"], ["mcp", "MCP servers"], ["mem", "memory files"]];
const tidyInv = (v) => {
  if (!v || typeof v !== "object" || Array.isArray(v)) return null;
  const out = { files: pairs(v.files, 20, 80, isCount), imp: new Map(pairs(v.imp, 20, 80, isCount)) };
  for (const [key] of SETUP) out[key] = count(v[key]);
  return out;
};
function tidyAgent(a) {
  if (!a || typeof a !== "object") return null;
  const out = { n: text(a.n, 200), k: text(a.k, 40), s: text(a.s, 20), i: ident(a.i), w: ident(a.w), f: a.f === true,
    m: text(a.m, 60), x: Number.isFinite(a.x) ? a.x : null, c: text(a.c, 20), p: text(a.p, 60), l: text(a.l, 60), u: text(a.u, 16),
    q: Number.isFinite(a.q) ? a.q : 0, z: Number.isFinite(a.z) && a.z > 0 ? a.z : null,
    // The inside of a session. Missing parts become empty, so a new live record also clears an old figure.
    tl: pairs(a.tl, 12, 40, isCount), tn: count(a.tn), er: count(a.er), ea: count(a.ea), lp: count(a.lp), sa: count(a.sa), hk: count(a.hk), hb: count(a.hb), hm: count(a.hm),
    sk: (Array.isArray(a.sk) ? a.sk : []).slice(0, 40).map((s) => text(s, 40)).filter(Boolean),
    cm: pairs(a.cm, 5, 20, isCount).filter((p) => CM.some((c) => c[0] === p[0])), fe: pairs(a.fe, 8, 80, isCount),
    fo: pairs(a.fo, 5, 80, (v) => typeof v === "string" && v !== "") };
  if (Array.isArray(a.ch)) {
    out.ch = a.ch.slice(0, 40).filter((c) => c && typeof c === "object").map((c) => ({ n: text(c.n, 60), r: c.r === true }));
  }
  return out;
}
function tidy(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.ws)) return null;
  return {
    t: Number.isFinite(raw.t) ? raw.t : 0,
    v: text(raw.v, 12), sel: text(raw.sel, 60), u: tidyInv(raw.u), uc: tidyInv(raw.uc),
    ws: raw.ws.slice(0, 200).filter((w) => w && typeof w === "object").map((w) => ({
      n: text(w.n, 120), c: text(w.c, 9), w: ident(w.w), f: w.f === true, inv: tidyInv(w.inv),
      a: (Array.isArray(w.a) ? w.a : []).slice(0, 300).map(tidyAgent).filter(Boolean),
    })),
  };
}

function read() {
  try {
    return tidy(JSON.parse(decodeURIComponent(location.hash.slice(1))));
  } catch (err) {
    console.error("hive: the link carries no readable data", err);
    return null;
  }
}

// Brings the picture up to date from the live file. The file knows the Claude Code sessions, every tab id
// and the open tab. It does not know the state of other tools: their boxes keep the values from the link,
// and they go only when their tab goes.
function merge(pic, raw) {
  const live = tidy(raw);
  if (!live || !Array.isArray(raw.a) || !Array.isArray(raw.tabs)) return false;
  const tabs = new Set(raw.tabs.map(ident).filter(Boolean));
  pic.u = live.u;
  pic.uc = live.uc;
  const agents = raw.a.slice(0, 300).map(tidyAgent).filter((a) => a && a.i && a.w);
  for (const lw of live.ws) {
    if (!lw.w) continue;
    let w = pic.ws.find((x) => x.w === lw.w || x.a.some((a) => a.w === lw.w)) || pic.ws.find((x) => !x.w && x.a.length === 0 && x.n === lw.n);
    if (!w) { w = { n: lw.n, c: "", a: [] }; pic.ws.push(w); }
    w.w = lw.w; w.f = lw.f; w.inv = lw.inv;
    if (lw.n) w.n = lw.n;
  }
  pic.ws = pic.ws.filter((w) => !w.w || live.ws.some((lw) => lw.w === w.w));
  for (const w of pic.ws) w.a = w.a.filter((a) => !a.i || tabs.has(a.i));
  const cur = ident(raw.cur);
  const known = cur && (agents.some((a) => a.i === cur) || pic.ws.some((w) => w.a.some((a) => a.i === cur)));
  for (const la of agents) {
    const w = pic.ws.find((x) => x.w === la.w);
    if (!w) continue;
    let a = null;
    for (const x of pic.ws) {
      const at = x.a.findIndex((y) => y.i === la.i);
      if (at >= 0) { a = x.a[at]; if (x !== w) { x.a.splice(at, 1); w.a.push(a); } break; }
    }
    if (!a) { a = { f: false }; w.a.push(a); }
    const keep = { f: a.f, ch: a.ch };
    Object.assign(a, la, { f: keep.f, ch: la.ch || keep.ch });
  }
  // The open tab moves the blue box only when it is a session's tab: this page itself is a tab too.
  if (known) for (const w of pic.ws) for (const a of w.a) a.f = a.i === cur;
  pic.t = live.t;
  return true;
}

// The page cannot call cmux. It puts the request in its title; the Agents panel reads tab titles and focuses
// the tab. The title returns after 5 seconds.
function jump(node, go) {
  const ask = () => {
    document.title = "go:" + go + ":" + Math.floor(Date.now() / 1000);
    setTimeout(() => { document.title = "Agent hive"; }, 5000);
  };
  node.addEventListener("click", ask);
  node.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
}

function drawHive(data) {
  const svg = document.getElementById("g");
  svg.replaceChildren();
  // A tree from left to right: hive, workspace, session, subagent. Each leaf takes one line of height.
  const W = [90, 190, 300, 200], GAP = 44, ROW = 40;
  const X = [0, W[0] + GAP, W[0] + W[1] + 2 * GAP, W[0] + W[1] + W[2] + 3 * GAP];
  let line = 0;
  const links = [], nodes = [];
  const place = (node, depth) => {
    const kids = node.kids || [];
    if (kids.length === 0) node.y = line++ * ROW + ROW / 2;
    else { for (const k of kids) place(k, depth + 1); node.y = (kids[0].y + kids[kids.length - 1].y) / 2; }
    node.depth = depth;
    nodes.push(node);
    for (const k of kids) links.push([node, k]);
  };
  const root = { title: "hive", sub: data.ws.length + " workspaces", color: "#8E8E93", kids: data.ws.map((w) => ({
    title: cut(w.n, 26), sub: (w.a || []).length + " session(s)" + (w.f ? " · current" : ""), here: w.f === true, color: /^#[0-9a-fA-F]{6,8}$/.test(w.c) ? w.c : "#8E8E93",
    kids: (w.a || []).map((a) => ({
      title: cut(a.n, 40), go: /^[0-9A-Fa-f-]{1,40}$/.test(a.i || "") && /^[0-9A-Fa-f-]{1,40}$/.test(a.w || "") ? a.w + ":" + a.i : "",
      sub: cut([a.u ? a.k + " " + a.u : a.k, a.m, a.x != null ? "ctx " + a.x + "%" : "", a.c, a.p].filter(Boolean).join(" · "), 52),
      // With an account, the same line in three parts, so the account name can carry its colour.
      kind: a.k, acct: a.u, rest: cut([a.m, a.x != null ? "ctx " + a.x + "%" : "", a.c, a.p].filter(Boolean).join(" · "), Math.max(0, 50 - (a.k + a.u).length)),
      // Orange only for a session that asks you; a full context gets red.
      here: a.f === true, color: (STATUS[a.s] || ["#8E8E93"])[0], hot: a.s === "needs_input" ? STATUS.needs_input[0] : a.x >= 80 ? "#FF6B61" : "",
      kids: (a.ch || []).map((c) => ({ title: cut(c.n, 28), sub: c.r ? "running" : "done", color: c.r ? "#0A84FF" : "#8E8E93" })),
    })),
  })) };
  place(root, 0);
  svg.setAttribute("width", X[3] + W[3] + 8);
  svg.setAttribute("height", Math.max(line, 1) * ROW + 8);
  for (const [a, b] of links) {
    const x1 = X[a.depth] + W[a.depth], x2 = X[b.depth], mid = (x1 + x2) / 2;
    svg.appendChild(el("path", { d: `M${x1},${a.y} C${mid},${a.y} ${mid},${b.y} ${x2},${b.y}` }));
  }
  for (const n of nodes) {
    const x = X[n.depth], w = W[n.depth];
    if (n.depth === 3 && n.sub === "done") { svg.appendChild(el("text", { class: "sub", x: x + 8, y: n.y + 4, style: "font-size:11px" }, n.title)); continue; }
    const g = el("g", n.go ? { class: n.here ? "go here" : "go", tabindex: 0, role: "link" } : { class: n.here ? "here" : "" });
    g.appendChild(el("rect", { class: "box", x, y: n.y - 15, width: w, height: 30, rx: 7, style: n.hot ? "stroke:" + n.hot + ";stroke-width:1.6" : "" }));
    g.appendChild(el("circle", { cx: x + 11, cy: n.y - 4, r: 4, fill: n.color }));
    g.appendChild(el("text", { x: x + 21, y: n.y }, n.title));
    const sub = el("text", { class: "sub", x: x + 21, y: n.y + 11 }, n.acct ? "" : n.sub);
    if (n.acct) {
      sub.appendChild(el("tspan", {}, n.kind + " "));
      sub.appendChild(el("tspan", { fill: acctColor(n.acct) }, n.acct));
      sub.appendChild(el("tspan", {}, n.rest ? " · " + n.rest : ""));
    }
    g.appendChild(sub);
    if (n.go) {
      // The page cannot call cmux. It puts the request in its title; the Agents panel reads tab titles and
      // focuses the tab. The title returns after 5 seconds.
      jump(g, n.go);
    }
    svg.appendChild(g);
    if (n.here && n.go && !drawn) setTimeout(() => g.scrollIntoView({ block: "center", inline: "nearest" }), 0);
  }
}

// ---- The history: what label-tabs.py keeps in history-data.js. Only known shapes pass. ----
const STATES = ["working", "needs_input", "idle"];
function tidyHistory(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.b)) return null;
  const s = {};
  for (const [sid, v] of Object.entries(raw.s && typeof raw.s === "object" ? raw.s : {}).slice(0, 2000)) {
    if (!/^[0-9a-f-]{8,64}$/.test(sid) || !v || typeof v !== "object") continue;
    s[sid] = { n: text(v.n, 60), w: text(v.w, 60), m: text(v.m, 40), x: Number.isFinite(v.x) ? v.x : null, c: text(v.c, 16), u: text(v.u, 16) };
  }
  const b = raw.b.slice(-20000).filter((x) => Array.isArray(x) && x.length === 4 && s[x[0]] && STATES.includes(x[1])
    && Number.isFinite(x[2]) && Number.isFinite(x[3]) && x[3] >= x[2]);
  const l = (Array.isArray(raw.l) ? raw.l : []).slice(-5000).filter((x) => Array.isArray(x) && x.length === 6
    && typeof x[0] === "string" && typeof x[1] === "string" && typeof x[2] === "string"
    && Number.isFinite(x[3]) && Number.isFinite(x[4]) && Number.isFinite(x[5]))
    .map((x) => [x[0].slice(0, 16), x[1].slice(0, 8), x[2].slice(0, 16), x[3], x[4], x[5]]);
  const num = Number.isFinite, list = (v) => (Array.isArray(v) ? v : []);
  // p: samples of context share and cost. e: marks (a compaction, a cold prompt cache). g: subagent runs.
  const p = list(raw.p).slice(-20000).filter((x) => Array.isArray(x) && x.length === 4 && s[x[0]] && num(x[1])
    && (x[2] === null || num(x[2])) && (x[3] === null || num(x[3])));
  const e = list(raw.e).slice(-2000).filter((x) => Array.isArray(x) && x.length === 3 && s[x[0]] && (x[1] === "compact" || x[1] === "cold") && num(x[2]));
  const g = list(raw.g).slice(-5000).filter((x) => Array.isArray(x) && x.length === 4 && s[x[0]] && typeof x[1] === "string" && num(x[2]) && num(x[3]) && x[3] >= x[2])
    .map((x) => [x[0], x[1].slice(0, 28), x[2], x[3]]);
  return { t: num(raw.t) ? raw.t : 0, s, b, l, p, e, g };
}

// ---- Shared helpers of the views ----
const svgRoot = () => document.getElementById("g");
const pageWidth = () => Math.max(640, Math.min(1500, document.documentElement.clientWidth - 32));
const dur = (sec) => {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.round(sec / 60) + "m";
  const mins = Math.round(sec / 60), h = Math.floor(mins / 60), m = mins % 60;
  if (h >= 48) { const d = Math.floor(h / 24); return h % 24 ? d + "d " + (h % 24) + "h" : d + "d"; }
  return m ? h + "h " + m + "m" : h + "h";
};
const two = (n) => String(n).padStart(2, "0");
const hhmm = (t) => { const d = new Date(t * 1000); return two(d.getHours()) + ":" + two(d.getMinutes()); };
const dayTime = (t) => new Date(t * 1000).toLocaleDateString(undefined, { weekday: "short" }) + " " + hhmm(t);
const money = (c) => { const n = parseFloat(String(c ?? "").replace(/[^0-9.]/g, "")); return Number.isFinite(n) ? n : 0; };
const sessName = (title) => (/^\[([^\]]+)\]/.exec(String(title ?? "")) || [])[1] || "";
const agents = () => pic.ws.flatMap((w) => (w.a || []).map((a) => ({ ...a, wn: w.n, wc: w.c })));
const goOf = (a) => (a && /^[0-9A-Fa-f-]{1,40}$/.test(a.i || "") && /^[0-9A-Fa-f-]{1,40}$/.test(a.w || "") ? a.w + ":" + a.i : "");
// The box of an open session with this name, for a jump from a view that knows names only.
const agentNamed = (name) => (name ? agents().find((a) => sessName(a.n) === name) : null);
// The end of each session of the history: session id -> the end of its last block.
const lastSeen = () => { const end = new Map(); for (const b of hist.b) end.set(b[0], Math.max(end.get(b[0]) || 0, b[3])); return end; };
// Which session of the history is an open one: gives a function from a session id to its open box, or null.
// A name can come back (a new session takes it), so the open session is the newest one of that name.
function openOf() {
  const end = lastSeen(), newest = new Map();
  for (const [sid, t] of end) { const n = hist.s[sid].n; if (!newest.has(n) || t > end.get(newest.get(n))) newest.set(n, sid); }
  return (sid) => (newest.get(hist.s[sid].n) === sid ? agentNamed(hist.s[sid].n) || null : null);
}
// The sessions that closed today (since midnight), from the history, as rows like the open ones. A closed session has
// no tab to go to.
function closedToday() {
  const day = new Date((hist.t || Math.floor(Date.now() / 1000)) * 1000);
  day.setHours(0, 0, 0, 0);
  const from = day.getTime() / 1000, open = openOf();
  return [...lastSeen()].filter(([sid, t]) => t >= from && money(hist.s[sid].c) > 0 && !open(sid))
    .map(([sid]) => { const v = hist.s[sid]; return { n: v.n, wn: v.w || "no workspace", m: v.m, c: v.c, u: v.u, k: "claude", closed: true }; });
}
const empty = (svg, lines) => {
  svg.setAttribute("width", 640); svg.setAttribute("height", 30 + lines.length * 20);
  lines.forEach((line, k) => svg.appendChild(el("text", { class: k ? "sub" : "", x: 4, y: 24 + k * 20, style: k ? "font-size:12px" : "" }, line)));
};
const MODELS = [["opus", "#B79CFF", "Opus"], ["fable", "#4FD1C5", "Fable"], ["mythos", "#4FD1C5", "Mythos"], ["sonnet", "#6FB1FF", "Sonnet"],
  ["haiku", "#8FE0A6", "Haiku"], ["", "#B0B0B8", "other"]];
const modelOf = (m) => MODELS.find(([key]) => String(m ?? "").toLowerCase().includes(key));
const ctxColor = (x) => (x >= 80 ? "#FF6B61" : x >= 50 ? "#FFD60A" : "#34C759");
const TOOL_NAMES = { claude: "Claude", codex: "Codex", opencode: "OpenCode", grok: "Grok", agy: "Antigravity" };
let legendItems = [];
// The tool of a session as a name for people, from its kind ("claude", "codex", ...); an unknown kind stays as it is.
const toolOf = (k) => {
  const s = String(k ?? "").toLowerCase(), key = Object.keys(TOOL_NAMES).find((t) => s.includes(t));
  return key === "claude" ? "Claude Code" : key ? TOOL_NAMES[key] : String(k ?? "").slice(0, 20) || "unknown tool";
};
// The open sessions per tool: [[tool, count], ...], the most first.
const openTools = () => { const m = new Map(); for (const a of agents()) m.set(toolOf(a.k), (m.get(toolOf(a.k)) || 0) + 1); return [...m].sort((p, q) => q[1] - p[1]); };

    [Math.round((groups[0].v / total) * 100) + "%", "in " + cut(groups[0].n, 20), ""], today > 0 ? ["$" + today.toFixed(2), "rise recorded since 00:00", ""] : [String(all.length), "sessions with a cost", ""]]);
  // One bar per workspace: its length is the cost of the workspace, a part per session, the largest first. The tint is
  // the model; a closed session is paler. Parts too thin to read join one grey part at the end.
  const LBL = 150, AMT = 130, BAR = 24, room = W - LBL - AMT;
  for (const g of groups) {
    svg.appendChild(el("text", { x: 2, y: y + 17, style: "font-size:13px;font-weight:600" }, cut(g.n, 18)));
    svg.appendChild(el("text", { x: W - AMT + 14, y: y + 17, style: "font-size:13px;font-weight:600" }, "$" + g.v.toFixed(2)));
    svg.appendChild(el("text", { class: "sub", x: W - 2, y: y + 17, "text-anchor": "end", style: "font-size:11px" }, Math.round((g.v / total) * 100) + "%"));
    svg.appendChild(track(LBL, y, room, BAR));
    const full = Math.max(8, (g.v / groups[0].v) * room);
    let x0 = LBL, rest = 0, restN = 0;
    const part = (w, fill, tip, a) => {
      const go = a ? goOf(a) : "", box = el("g", go ? { class: "go", tabindex: 0, role: "link" } : {});
      const rect = el("rect", { x: x0, y, width: Math.max(2, w - 2), height: BAR, rx: 5, style: "stroke:none;fill:" + fill });
      rect.appendChild(el("title", {}, tip));
      box.appendChild(rect);
      if (a && w >= 96) box.appendChild(el("text", { x: x0 + 8, y: y + 16.5, style: "font-size:11px;font-weight:600" }, cut(a.c + " " + (sessName(a.n) || a.n), Math.floor((w - 16) / 6.6))));
      if (go) jump(box, go);
      svg.appendChild(box);
      x0 += w;
    };
    for (const { a, v } of g.a) {
      const w = (v / g.v) * full;
      if (w < 14) { rest += v; restN++; continue; }
      part(w, "color-mix(in srgb, " + modelOf(a.m)[1] + (a.closed ? " 30%" : " 62%") + ", var(--card))", a.n + " · " + (a.m || a.k) + " · " + a.c + (a.u ? " · " + a.u : "") + (a.closed ? " · closed" : ""), a);
    }
    if (restN) part(Math.max(8, (rest / g.v) * full), "color-mix(in srgb, var(--dim) 45%, var(--card))", restN + " smaller session" + (restN > 1 ? "s" : "") + " · $" + rest.toFixed(2));
    y += BAR + 10;
  }
  y += 14;
  // The ranked list: every session is readable here, also the ones that are thin lines in the map.
  const ROW = 34, LEFT = 330, RIGHT = 150, max = all[0].v, shown = all.slice(0, 12), rest = all.slice(12);
  svg.appendChild(el("text", { x: 2, y: y + 4, style: "font-size:12px;font-weight:700" }, "By session"));
  y += 14;
  for (const { a, v, ws } of shown) {
    const model = modelOf(a.m), go = goOf(a);
    const g = el("g", go ? { class: "go", tabindex: 0, role: "link" } : {});
    g.appendChild(card(y, W, ROW));
    g.appendChild(el("circle", { cx: 16, cy: y + 17.5, r: 4.5, fill: model[1] }));
    g.appendChild(el("text", { x: 30, y: y + 22, style: "font-size:13px;font-weight:600" }, cut(a.n, 26)));
    g.appendChild(el("text", { class: "sub", x: 222, y: y + 22, style: "font-size:11px" }, cut(a.closed ? ws + " · closed" : ws, 15)));
    g.appendChild(track(LEFT, y + 12, W - LEFT - RIGHT, 11));
    g.appendChild(el("rect", { x: LEFT, y: y + 12, width: Math.max(4, (v / max) * (W - LEFT - RIGHT)), height: 11, rx: 5.5, fill: model[1] }));
    g.appendChild(el("text", { x: W - RIGHT + 14, y: y + 22, style: "font-size:13px;font-weight:600" }, a.c));
    g.appendChild(el("text", { class: "sub", x: W - 14, y: y + 22, "text-anchor": "end", style: "font-size:11px" }, Math.round((v / total) * 100) + "%"));
    if (go) jump(g, go);
    svg.appendChild(g);
    y += ROW + 5;
  }
  if (rest.length) {
    const sum = rest.reduce((n, r) => n + r.v, 0);
    svg.appendChild(el("text", { class: "sub", x: 30, y: y + 12, style: "font-size:12px" }, rest.length + " smaller sessions, $" + sum.toFixed(2) + " together (" + Math.round((sum / total) * 100) + "%)"));
    y += 26;
  }
  // Cost per hour: the rise of a session's cost between two samples counts in the hour of the later sample.
  const HOURS = 12, clockNow = hist.t || Math.floor(Date.now() / 1000), hourNow = Math.floor(clockNow / 3600), sums = Array.from({ length: HOURS }, () => new Map());
  let since = Infinity;
  for (const [sid, list] of bySession(hist.p)) {
    const pts = list.filter((p) => p[3] !== null).sort((p, q) => p[1] - q[1]), model = modelOf(hist.s[sid].m);
    if (pts.length) since = Math.min(since, pts[0][1]);
    for (let k = 1; k < pts.length; k++) {
      const slot = HOURS - 1 - (hourNow - Math.floor(pts[k][1] / 3600)), rise = pts[k][3] - pts[k - 1][3];
      if (slot >= 0 && rise > 0) sums[slot].set(model, (sums[slot].get(model) || 0) + rise);
    }

  const perHour = sums.map((m) => [...m.values()].reduce((p, q) => p + q, 0)), peak = Math.max(...perHour);
  y = section(svg, y + 14, W, "Cost per hour", peak > 0 ? "$" + perHour[HOURS - 1].toFixed(2) + " in this hour so far" : "");
  if (peak <= 0) {
    svg.appendChild(el("text", { class: "sub", x: 2, y: y + 10, style: "font-size:12px" }, "No rise of a cost recorded yet. This part fills while your sessions work"
      + (since < Infinity ? ": the history takes cost samples since " + hhmm(since) + "." : ".")));
    y += 22;
  } else {
    const TALL = 150, slotW = (W - 36) / HOURS, bw = Math.min(46, slotW - 10), base = y + TALL - 28;
    svg.appendChild(card(y, W, TALL));
    svg.appendChild(el("line", { class: "grid", x1: 18, x2: W - 18, y1: base, y2: base }));
    sums.forEach((bySlot, k) => {
      const bx = 18 + k * slotW + (slotW - bw) / 2, start = (hourNow - (HOURS - 1 - k)) * 3600;
      let top = base;
      for (const model of MODELS) {
        const v = bySlot.get(model);
        if (!v) continue;
        const h = Math.max(3, (v / peak) * (TALL - 62));
        const seg = el("rect", { x: bx, y: top - h, width: bw, height: Math.max(1, h - 2), rx: 3, fill: model[1] });
        seg.appendChild(el("title", {}, model[2] + " · $" + v.toFixed(2) + " · " + hhmm(start) + " to " + hhmm(start + 3600)));
        svg.appendChild(seg);
        top -= h;
      }
      if (perHour[k] > 0) svg.appendChild(el("text", { x: bx + bw / 2, y: top - 5, "text-anchor": "middle", style: "font-size:11px;font-weight:600" }, "$" + perHour[k].toFixed(perHour[k] < 10 ? 2 : 0)));
      svg.appendChild(el("text", { class: "sub", x: bx + bw / 2, y: base + 16, "text-anchor": "middle", style: "font-size:10px" + (k === HOURS - 1 ? ";font-weight:700" : "") }, k === HOURS - 1 ? "now" : hhmm(start)));
    });
    y += TALL;
  }
  size(svg, W, y + 6);
  const seen = new Set(all.map((x) => modelOf(x.a.m)));
  legendItems = MODELS.filter((m) => seen.has(m) && m[0] !== "mythos").map((m) => [m[1], m[2]]);
  return "One bar per workspace, one part per session; a paler part is a session closed today, the grey part holds the small ones. Each session counts with its whole cost, at list price. Click a part or a line to go to its tab."
    + coverage(["Claude Code", ...all.map((x) => toolOf(x.a.k))]);
}

// ---- Flow: where the cost goes: account (when there is more than one), workspace, model ----
function drawFlow(svg) {
  const rows = [...agents(), ...closedToday()].map((a) => ({ a, v: money(a.c) })).filter((r) => r.v > 0);
  const total = rows.reduce((sum, r) => sum + r.v, 0);
  if (total <= 0) {
    empty(svg, ["No cost figures yet.", "A Claude Code session reports its cost through the status line of this kit, after its first reply.", ...onlyOthers(["Claude Code"])]);
    return "Flow: no data." + coverage(["Claude Code"]);
  }
  const cols = [{ head: "Workspace", key: (r) => r.a.wn || "no workspace", color: () => "#98989d" },
    { head: "Model", key: (r) => modelOf(r.a.m)[2], color: (k) => MODELS.find((m) => m[2] === k)[1] }];
  const several = new Set(rows.map((r) => r.a.u)).size > 1;
  // Accounts are grey like workspaces: colour in this view means the model only.
  if (several) cols.unshift({ head: "Account", key: (r) => r.a.u || "main account", color: () => "#98989d" });
  const W = Math.min(pageWidth(), 1100), NODE = 12, GAP = 34, scale = 230 / total;
  for (const c of cols) {
    const sums = new Map();
    for (const r of rows) sums.set(c.key(r), (sums.get(c.key(r)) || 0) + r.v);
    c.nodes = [...sums].sort((p, q) => q[1] - p[1]).map(([k, v]) => ({ k, v, h: Math.max(3, v * scale), out: 0, in: 0 }));
  }
  const last = cols[cols.length - 1], top = cols[cols.length - 1].nodes[0];
  let y = tiles(svg, [["$" + total.toFixed(2), "whole cost of the sessions open now or closed today", ""],
    [Math.round((top.v / total) * 100) + "%", "goes to " + top.k, last.color(top.k)],
    [String(cols[cols.length - 2].nodes.length), cols[cols.length - 2].nodes.length === 1 ? "workspace with a cost" : "workspaces with a cost", ""]]);
  cols.forEach((c, j) => {
    c.x = cols.length === 1 ? 0 : j * (W - NODE) / (cols.length - 1);
    svg.appendChild(el("text", { class: "sub", x: j === cols.length - 1 ? W : c.x, y: y + 10, "text-anchor": j === cols.length - 1 ? "end" : "start", style: "font-size:11px" }, c.head));
    let ny = y + 22;
    for (const n of c.nodes) { n.y = ny; ny += n.h + GAP; }
    c.bottom = ny - GAP;
  });
  // The bands first, so the nodes and the names lie on them.
  for (let j = 0; j + 1 < cols.length; j++) {
    const a = cols[j], b = cols[j + 1], x0 = a.x + NODE, x1 = b.x, mx = (x0 + x1) / 2;
    for (const s of a.nodes) for (const t of b.nodes) {
      const v = rows.filter((r) => a.key(r) === s.k && b.key(r) === t.k).reduce((sum, r) => sum + r.v, 0);
      if (v <= 0) continue;
      const h = Math.max(1.5, v * scale), ya = s.y + s.out, yb = t.y + t.in;
      s.out += v * scale; t.in += v * scale;
      const band = el("path", { d: `M${x0},${ya} C${mx},${ya} ${mx},${yb} ${x1},${yb} V${yb + h} C${mx},${yb + h} ${mx},${ya + h} ${x0},${ya + h} Z`,
        style: "stroke:none;fill:" + (b === last ? b.color(t.k) : a.color(s.k)) + ";fill-opacity:.3" });
      band.appendChild(el("title", {}, "$" + v.toFixed(2) + " · " + s.k + " → " + t.k));
      svg.appendChild(band);
    }
  }
  cols.forEach((c, j) => {
    const right = j === cols.length - 1;
    for (const n of c.nodes) {
      svg.appendChild(el("rect", { x: c.x, y: n.y, width: NODE, height: n.h, rx: Math.min(4, n.h / 2), fill: c.color(n.k) }));
      const tx = right ? c.x - 10 : c.x + NODE + 10, ty = n.y + Math.min(n.h / 2, 14) + 2;
      svg.appendChild(el("text", { x: tx, y: ty, "text-anchor": right ? "end" : "start", style: "font-size:13px;font-weight:600" }, cut(n.k, 28)));
      svg.appendChild(el("text", { class: "sub", x: tx, y: ty + 15, "text-anchor": right ? "end" : "start", style: "font-size:11px" }, "$" + n.v.toFixed(2) + " · " + Math.round((n.v / total) * 100) + "%"));
    }
  });
  size(svg, W, Math.max(...cols.map((c) => c.bottom)) + 24);
  legendItems = last.nodes.map((n) => [last.color(n.k), n.k]);
  return "The width of a band is the cost. Open Claude Code sessions and the ones closed today, each with its whole cost, at list price." + (several ? "" : " A column for accounts shows when the sessions run under more than one account.")
    + coverage(["Claude Code", ...rows.map((r) => toolOf(r.a.k))]);
}

// ---- Limits: one card per limit window: the readings, and where the line goes ----
const WINDOW_SECS = { "5h": 18000, week: 604800 };
function drawLimits(svg) {
  const now = hist.t || Math.floor(Date.now() / 1000);
  const groups = new Map();
  for (const r of hist.l) {
    const key = r[0] + "|" + r[1] + "|" + r[2];
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const charts = [];
  for (const rows of groups.values()) {
    const reset = Math.max(...rows.map((r) => r[4]));
    if (reset <= now) continue;  // a window that ended, or one with no reset time
    const pts = rows.filter((r) => r[4] === reset).sort((p, q) => p[5] - q[5]);
    charts.push({ tool: pts[0][0], win: pts[0][1], acct: pts[0][2], reset, pts });
  }
  if (charts.length === 0) {
    empty(svg, ["No live limit window in the history yet.", "The watcher records each limit figure with its time. A tool that leaves no limit data cannot show here.",
      ...onlyOthers(["Claude Code", "Codex"])]);
    return "Limits: no data." + coverage(["Claude Code", "Codex"]);
  }
  charts.sort((p, q) => (p.tool + p.acct + p.win).localeCompare(q.tool + q.acct + q.win));
  const W = pageWidth(), COLS = W >= 840 && charts.length > 1 ? 2 : 1, GAP = 12, CW = (W - (COLS - 1) * GAP) / COLS, CH = 244;
  const L = 46, R = 22, T = 98, B = 34, plotW = CW - L - R, plotH = CH - T - B;
  size(svg, W, Math.ceil(charts.length / COLS) * (CH + GAP));
  let risky = 0;
  charts.forEach((c, k) => {
    const left = (k % COLS) * (CW + GAP), top = Math.floor(k / COLS) * (CH + GAP), last = c.pts[c.pts.length - 1];
    const length = WINDOW_SECS[c.win] || Math.max(3600, c.reset - c.pts[0][5]);
    const start = c.reset - length;
    const x = (t) => left + L + (Math.min(Math.max(t, start), c.reset) - start) / length * plotW;
    const y = (v) => top + T + plotH - (Math.min(Math.max(v, 0), 100) / 100) * plotH;
    // The pace: from the readings when their span is long enough, else the average since the window opened.
    const first = c.pts.find((p) => last[5] - p[5] <= length / 4) || c.pts[0];
    // A share is a whole number, so a short span gives a wild pace: the span must be 2% of the window or more.
    const measured = last[5] - first[5] >= Math.max(600, length / 50);
    const rate = measured ? (last[3] - first[3]) / (last[5] - first[5]) : (last[5] > start ? last[3] / (last[5] - start) : 0);
    const hit = rate > 0 ? last[5] + (100 - last[3]) / rate : Infinity, hot = hit < c.reset;
    if (hot) risky += 1;
    const atReset = Math.min(100, Math.round(last[3] + Math.max(rate, 0) * (c.reset - last[5])));
    // Neutral under 70%, yellow to 89%, red from 90% or when the line reaches 100% before the reset.
    const color = hot || last[3] >= 90 ? "#FF6B61" : last[3] >= 70 ? "#FFD60A" : "var(--fg)";
    svg.appendChild(el("rect", { class: "box", x: left + 0.5, y: top + 0.5, width: CW - 1, height: CH, rx: 12, style: hot ? "stroke:#FF6B61;stroke-opacity:.8" : "stroke-opacity:.5" }));
    // The head of the card: the name, the share in big figures, and the verdict.
    const head = el("text", { x: left + 18, y: top + 26, style: "font-size:13px;font-weight:700" }, (TOOL_NAMES[c.tool] || c.tool) + " · " + c.win);
    if (c.acct) head.appendChild(el("tspan", { fill: acctColor(c.acct), style: "font-weight:600" }, "  " + c.acct));
    // With cards of named accounts beside it, the card of the usual folder says which one it is, as in Flow.
    else if (charts.some((o) => o.tool === c.tool && o.acct)) head.appendChild(el("tspan", { fill: "#98989d", style: "font-weight:600" }, "  main account"));
    svg.appendChild(head);
    svg.appendChild(el("text", { x: left + 18, y: top + 62, style: "font-size:30px;font-weight:700;fill:" + color }, last[3] + "%"));
    svg.appendChild(el("text", { class: "sub", x: left + 18, y: top + 78, style: "font-size:11px" }, "used · resets in " + dur(c.reset - now) + (now - last[5] > 600 ? " · last reading " + dayTime(last[5]) : "")));
    const thin = !hot && Math.max(...c.pts.map((p) => p[3])) - Math.min(...c.pts.map((p) => p[3])) < 3;  // a move of 1 or 2 points is rounding, not a pace
    const verdict = hot ? "100% " + dayTime(hit) : thin ? "too early to forecast" : rate > 0 ? "about " + atReset + "% at the reset" : "no growth";
    const note = hot ? dur(c.reset - hit) + " before the reset" : thin ? "the readings moved under 3 points" : (measured ? "pace of the last readings" : "average pace of this window");
    const vw = Math.max(verdict.length * 7.4 + 28, 150), vc = hot ? "#FF6B61" : thin ? "#98989d" : "#34C759";
    svg.appendChild(el("rect", { x: left + CW - vw - 16, y: top + 16, width: vw, height: 28, rx: 14, style: "fill:color-mix(in srgb, " + vc + " 20%, var(--card));stroke:" + vc + ";stroke-opacity:.6" }));
    svg.appendChild(el("text", { x: left + CW - 16 - vw / 2, y: top + 35, "text-anchor": "middle", style: "font-size:13px;font-weight:600;fill:" + vc }, verdict));
    svg.appendChild(el("text", { class: "sub", x: left + CW - 18, y: top + 62, "text-anchor": "end", style: "font-size:11px" + (hot ? ";fill:#FF6B61" : "") }, note));
    // The plot: the passed part of the window has a tint.
    svg.appendChild(el("rect", { x: x(start), y: y(100), width: x(now) - x(start), height: plotH, style: "fill:var(--fg);opacity:.045" }));
    for (const v of [0, 50, 100]) {
      svg.appendChild(el("line", { class: "grid", x1: left + L, x2: left + L + plotW, y1: y(v), y2: y(v), style: "opacity:.6" }));
      svg.appendChild(el("text", { class: "sub", x: left + L - 7, y: y(v) + 3.5, "text-anchor": "end" }, v + "%"));
    }
    svg.appendChild(el("line", { x1: left + L, x2: left + L + plotW, y1: y(80), y2: y(80), style: "stroke:#FF6B61;stroke-dasharray:2 5;opacity:.75" }));
    svg.appendChild(el("text", { class: "sub", x: left + L - 7, y: y(80) + 3.5, "text-anchor": "end", style: "font-size:11px;fill:#FF6B61" }, "80%"));
    // Before the first reading nothing is known: a faint line from 0% at the start of the window.
    const line = c.pts.map((p) => x(p[5]) + "," + y(p[3]));
    svg.appendChild(el("path", { d: "M" + x(start) + "," + y(0) + " L" + line.join(" L") + " L" + x(last[5]) + "," + y(0) + " Z", style: "fill:" + color + ";fill-opacity:.16;stroke:none" }));
    svg.appendChild(el("path", { d: "M" + x(start) + "," + y(0) + " L" + line[0], style: "stroke:" + color + ";stroke-width:1.6;stroke-dasharray:1 4;stroke-linecap:round;opacity:.8" }));
    if (c.pts.length > 1) svg.appendChild(el("path", { d: "M" + line.join(" L"), style: "stroke-width:2.6;stroke-linejoin:round;stroke:" + color }));
    if (rate > 0 && !thin) {
      const end = hot ? [hit, 100] : [c.reset, last[3] + rate * (c.reset - last[5])];
      svg.appendChild(el("path", { d: `M${x(last[5])},${y(last[3])} L${x(end[0])},${y(end[1])}`, style: "stroke-dasharray:6 5;stroke-width:2.2;stroke-linecap:round;stroke:" + (hot ? "#FF6B61" : "#98989d") }));
      if (hot) svg.appendChild(el("circle", { cx: x(hit), cy: y(100), r: 4.5, style: "fill:var(--card);stroke:#FF6B61;stroke-width:2.2" }));
    }
    svg.appendChild(el("line", { x1: x(now), x2: x(now), y1: y(100) - 4, y2: y(0), style: "stroke:var(--fg);stroke-width:1.2;opacity:.55" }));
    svg.appendChild(el("circle", { cx: x(last[5]), cy: y(last[3]), r: 5.5, style: "fill:" + color + ";stroke:var(--card);stroke-width:2" }));
    svg.appendChild(el("text", { class: "sub", x: left + L, y: top + CH - 12, style: "font-size:11px" }, dayTime(start)));
    if (x(now) > left + L + 90 && x(now) < left + L + plotW - 130) svg.appendChild(el("text", { x: x(now), y: top + CH - 12, "text-anchor": "middle", style: "font-size:11px;font-weight:600" }, "now"));
    svg.appendChild(el("text", { class: "sub", x: left + L + plotW, y: top + CH - 12, "text-anchor": "end", style: "font-size:11px" }, "reset " + dayTime(c.reset)));
  });
  legendItems = [["var(--fg)", "used, under 70%"], ["#FFD60A", "70% to 89%"], ["#FF6B61", "90% and more, or 100% before the reset"], ["#98989d", "forecast (dashed)"],
    ["#98989d", "dotted = no reading yet for that time"]];
  return (risky ? risky + " of " + charts.length + " limit windows reach 100% before the reset at this pace." : "No limit window reaches 100% before the reset at this pace.")
    + " The forecast is a straight line: it knows nothing about your plans." + coverage(["Claude Code", "Codex", ...charts.map((c) => toolOf(c.tool))]);
}

// ---- Queue: who waits for you, and for how long ----
function drawQueue(svg) {
  const now = hist.t || Math.floor(Date.now() / 1000);
  const newest = {};  // session name -> its newest block
  for (const b of hist.b) { const n = hist.s[b[0]].n; if (!newest[n] || b[3] >= newest[n][3]) newest[n] = b; }
  const rows = agents().filter((a) => a.s === "needs_input" || a.s === "idle").map((a) => {
    const b = newest[sessName(a.n)];

  // The work of an hour cell in four characters or fewer: "45m", "1.5h", "12h".
  const cellTime = (v) => (v < 3570 ? Math.round(v / 60) + "m" : v < 35640 ? +(v / 3600).toFixed(1) + "h" : Math.round(v / 3600) + "h");
  const top = tiles(svg, [[dur(weekBusy), "at least one agent at work, 7 days", STATUS.working[0], dur(total) + " agent-hours (sessions added up)"],
    [dur(todayBusy), "today", "", dur(today) + " agent-hours"],
    [max ? two(best % 24) + ":00" : "–", max ? "busiest hour, " + bestDay.toLocaleDateString(undefined, { weekday: "short" }) + " (" + dur(max) + ")" : "no work in the last 7 days", ""],
    [active + " of " + DAYS, "days with history", ""]]);
  const W = pageWidth(), LEFT = 104, RIGHT = 84, CW = Math.min(46, (W - LEFT - RIGHT) / 24), row0 = max ? cells.findIndex((row) => row.some(Boolean)) : DAYS - 1,
    CHH = DAYS - row0 <= 2 ? 60 : 34, TOP = top + 22, hourNow = new Date(now * 1000).getHours();
  size(svg, LEFT + 24 * CW + RIGHT, TOP + (DAYS - row0) * CHH + 8);
  for (let h = 0; h < 24; h += 2) svg.appendChild(el("text", { class: "sub", x: LEFT + h * CW + (CW - 4) / 2, y: top + 12, "text-anchor": "middle", style: "font-size:11px" }, two(h)));
  cells.forEach((row, r) => {
    const date = new Date((day0 + r * 86400 + 43200) * 1000), y = TOP + (r - row0) * CHH, isToday = r === DAYS - 1, base = y + (CHH - 4) / 2 + 4;
    if (r < row0) return;
    svg.appendChild(el("text", { x: 2, y: base, style: "font-size:12px;" + (isToday ? "font-weight:700" : "opacity:.7") },
      isToday ? "Today" : date.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })));
    row.forEach((v, h) => {
      const share = v / max;
      const rect = el("rect", { x: LEFT + h * CW, y, width: CW - 4, height: CHH - 4, rx: 6,
        style: v ? "fill:color-mix(in srgb, #0A84FF " + Math.round(30 + 70 * share) + "%, var(--card))" : "fill:var(--card);opacity:.6" });
      rect.appendChild(el("title", {}, two(h) + ":00 · " + (v ? dur(v) + " of agent work" : "no work")));
      svg.appendChild(rect);
      if (v && CW >= 28 && cellTime(v).length * 5.8 <= CW - 6) svg.appendChild(el("text", { x: LEFT + h * CW + (CW - 4) / 2, y: base - 0.5, "text-anchor": "middle", style: "font-size:10px;font-weight:600;fill:#fff;pointer-events:none" }, cellTime(v)));
      if (isToday && h === hourNow) svg.appendChild(el("rect", { x: LEFT + h * CW - 1.5, y: y - 1.5, width: CW - 1, height: CHH - 1, rx: 7.5, style: "fill:none;stroke:var(--fg);stroke-width:1.5" }));
    });
    const sum = row.reduce((p, q) => p + q, 0);
    svg.appendChild(el("text", { x: LEFT + 24 * CW + 10, y: base, style: "font-size:12px;font-weight:600" + (sum ? "" : ";opacity:.3") }, sum ? dur(sum) : "–"));
  });
  // The month: one cell per day and one row per week, from the first week with history (5 weeks at most).
  const perDay = new Map(), dayOf = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  for (const b of hist.b) {
    if (b[1] !== "working") continue;
    for (let t = b[2]; t < b[3];) {
      const d = dayOf(new Date(t * 1000)), next = Math.min(b[3], new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1).getTime() / 1000);
      perDay.set(d.getTime(), (perDay.get(d.getTime()) || 0) + next - t);
      t = next;
    }
  }
  const monday = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate() - ((d.getDay() + 6) % 7));
  const todayDate = dayOf(new Date(now * 1000)), lastWeek = monday(todayDate), firstDay = new Date(Math.min(...perDay.keys()));
  const weeks = Math.min(5, Math.round((lastWeek - monday(firstDay)) / 604800000) + 1), dayMax = Math.max(...perDay.values());
  const gridW = LEFT + 24 * CW + RIGHT, DW = Math.min(132, gridW / 7), DH = 50;
  let cy = section(svg, TOP + (DAYS - row0) * CHH + 18, gridW, "Days", weeks * 7 + " days, a week per row");
  for (let c = 0; c < 7; c++) {
    svg.appendChild(el("text", { class: "sub", x: c * DW + 8, y: cy + 8, style: "font-size:11px" },
      new Date(lastWeek.getFullYear(), lastWeek.getMonth(), lastWeek.getDate() + c).toLocaleDateString(undefined, { weekday: "short" })));
  }
  cy += 16;
  for (let w = 0; w < weeks; w++) for (let c = 0; c < 7; c++) {
    const date = new Date(lastWeek.getFullYear(), lastWeek.getMonth(), lastWeek.getDate() - (weeks - 1 - w) * 7 + c);
    const v = perDay.get(date.getTime()) || 0, share = v / dayMax, later = date > todayDate, cx0 = c * DW, y0 = cy + w * DH, strong = share >= 0.55;
    const cell = el("rect", { x: cx0, y: y0, width: DW - 4, height: DH - 4, rx: 7,
      style: v ? "fill:color-mix(in srgb, #0A84FF " + Math.round(22 + 78 * share) + "%, var(--card))" : "fill:var(--card);opacity:" + (later ? ".25" : ".6") });
    cell.appendChild(el("title", {}, date.toLocaleDateString(undefined, { weekday: "long", day: "numeric", month: "long" }) + " · " + (v ? dur(v) + " of agent work" : later ? "not yet" : "no work in the history")));
    svg.appendChild(cell);
    svg.appendChild(el("text", { x: cx0 + 8, y: y0 + 16, style: "font-size:11px;pointer-events:none;" + (strong ? "fill:#fff" : "opacity:" + (later ? ".3" : ".7")) },
      date.getDate() === 1 || (w === 0 && c === 0) ? date.toLocaleDateString(undefined, { day: "numeric", month: "short" }) : String(date.getDate())));
    if (v) svg.appendChild(el("text", { x: cx0 + DW - 12, y: y0 + DH - 14, "text-anchor": "end", style: "font-size:13px;font-weight:600;pointer-events:none" + (strong ? ";fill:#fff" : "") }, dur(v)));
    if (date.getTime() === todayDate.getTime()) svg.appendChild(el("rect", { x: cx0 - 1.5, y: y0 - 1.5, width: DW - 1, height: DH - 1, rx: 8.5, style: "fill:none;stroke:var(--fg);stroke-width:1.5" }));
  }
  size(svg, gridW, cy + weeks * DH + 6);
  legendItems = [["#0A84FF", "stronger blue = more agent work in that hour or day"], ["#98989d", "the outlined cells are the current hour and today"]];
  return "Agent work per hour for the last " + DAYS + " days, and per day for up to 5 weeks, Claude Code sessions. Two agents that work in one hour count twice."
    + (row0 && max ? " The history started " + (DAYS - row0 === 1 ? "today" : (DAYS - row0) + " days ago") + ": earlier days are not shown." : "")
    + coverage(["Claude Code"]);
}

// ---- Setup: what the folder of each workspace gives its agents ----
const LONG_FILE = 40 * 1024;  // an instruction file over this size costs much context in every session
function setupCard(w, CW) {
  const g = el("g", {}), IW = CW - 32, R = 16 + IW, files = w.inv.files.map(([name, b]) => [name, b, w.inv.imp.get(name) || 0]), total = files.reduce((s, f) => s + f[1] + f[2], 0);
  g.appendChild(el("text", { x: 16, y: 26, style: "font-size:13px;font-weight:600" }, cut(w.n || "no name", Math.floor(IW / 8))));
  g.appendChild(el("text", { class: "sub", x: 16, y: 42, style: "font-size:11px" }, files.length ? plural(files.length, "instruction file", "instruction files") + " · " + kb(total) : "no instruction files"));
  let y = 56;
  for (const [name, own, more] of files) {
    // A file can import others with "@path" lines: they load with it, so they count in its size.
    const b = own + more, long = b > LONG_FILE, size = more ? kb(own) + " + " + kb(more) + " imports" : kb(own);
    const row = el("rect", { x: 10, y: y - 1, width: IW + 12, height: 18, rx: 4, style: long ? "fill:color-mix(in srgb, " + WARN + " 22%, var(--card))" : "fill:transparent" });
    row.appendChild(el("title", {}, name + " · " + size + (long ? ": a long instruction file costs context in every session" : "")));
    g.appendChild(row);
    if (long) g.appendChild(el("rect", { x: 10, y: y - 1, width: 3, height: 18, rx: 1.5, fill: WARN }));
    g.appendChild(el("text", { x: 16, y: y + 12, style: "font-size:12px;pointer-events:none" + (long ? ";font-weight:600" : "") }, cut(name, Math.floor((IW - (more ? 170 : 70)) / 7))));
    g.appendChild(el("text", { x: R, y: y + 12, "text-anchor": "end", style: "font-size:11px;pointer-events:none" + (long ? ";font-weight:600" : ";fill:var(--dim)") }, size));
    y += 19;
  }
  // The counts as chips in rows; a count of 0 shows no chip.
  const chips = SETUP.filter(([key]) => w.inv[key] > 0);
  if (chips.length) {
    let x = 16;
    y += 8;
    for (const [key, label] of chips) {
      const t = label + " " + w.inv[key], cw = t.length * 6.6 + 18;
      if (x + cw > R && x > 16) { x = 16; y += 26; }
      const chip = el("rect", { x, y, width: cw, height: 20, rx: 10, style: "fill:color-mix(in srgb, var(--fg) 7%, var(--card));stroke:var(--line)" });
      chip.appendChild(el("title", {}, w.inv[key] + " " + label + " in this folder"));
      g.appendChild(chip);
      g.appendChild(el("text", { x: x + cw / 2, y: y + 14, "text-anchor": "middle", style: "font-size:11px;font-weight:600;pointer-events:none" }, t));
      x += cw + 6;
    }
    y += 20;
  }
  return [g, y + 14, w.n];
}
function drawSetup(svg) {
  // A workspace with no file and only zero counts has no setup either.
  const found = (w) => w.inv && (w.inv.files.length > 0 || SETUP.some(([key]) => w.inv[key] > 0));
  const have = pic.ws.filter(found), none = pic.ws.filter((w) => !found(w)).map((w) => w.n || "no name");
  const noneLine = "no setup files found: " + none.join(", ");
  // The user folder of Claude Code: every session loads it, in every workspace. Its card comes first.
  const user = [...(found({ inv: pic.u }) ? [{ n: "Every workspace · user folder", inv: pic.u }] : []),
    ...(found({ inv: pic.uc }) ? [{ n: "Every Codex session · Codex folder", inv: pic.uc }] : [])];
  // The skills that the open sessions called, against the skills that the user folder holds.
  const called = new Set(agents().flatMap((a) => a.sk)).size;
  if (have.length + user.length === 0) {
    empty(svg, ["No setup figures yet.", "The watcher reads the instruction files and agent folders of each workspace.", ...(none.length ? [cut(noneLine, 96)] : [])]);
    return "Setup: no data.";
  }
  const W = pageWidth(), bytes = (inv) => inv.files.reduce((t, f) => t + f[1] + (inv.imp.get(f[0]) || 0), 0), total = have.reduce((s, w) => s + bytes(w.inv), 0);
  const shared = pic.u ? ["skills", "agents", "commands", "rules"].reduce((s, key) => s + (pic.u[key] || 0), 0) : 0;
  let y = tiles(svg, [[String(have.length), have.length === 1 ? "workspace with setup" : "workspaces with setup", ""], [kb(total), "instruction files with imports, all workspaces", ""],
    ...(shared ? [[String(shared), "skills, agents, commands, rules: user folder", ""]] : []),
    ...(pic.u && pic.u.skills ? [[String(called), "skills called by open sessions", ""]] : [])]);
  y = grid(svg, y, W, [...user, ...have], setupCard);
  if (none.length) {
    const line = el("text", { class: "sub", x: 2, y: y + 24, style: "font-size:12px" }, cut(noneLine, Math.floor(W / 6.6)));
    line.appendChild(el("title", {}, noneLine));
    svg.appendChild(line);
    y += 32;
  }
  size(svg, W, y + 6);
  legendItems = [[WARN, "instruction file over 40 KB: it costs context in every session"], ["var(--line)", "chip = how many of a kind the folder holds"]];
  return "What the user folder gives every session, and what the folder of each workspace adds: instruction files with their sizes, and counts of skills, agents, commands, rules, hooks, MCP servers and memory files."
    + " This shows what exists in the folder, not what was loaded into the window.";
}

// ---- The switch and the page loop ----
const VIEWS = [["hive", "Hive", null], ["timeline", "Timeline", drawTimeline], ["cost", "Cost", drawCost], ["flow", "Flow", drawFlow], ["limits", "Limits", drawLimits],
  ["queue", "Queue", drawQueue], ["context", "Context", drawContext], ["inside", "Inside", drawInside], ["rhythm", "Rhythm", drawRhythm], ["setup", "Setup", drawSetup]];
const stored = (key, fallback) => { try { return localStorage.getItem(key) || fallback; } catch (err) { return fallback; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch (err) { console.warn("hive: the view is not remembered", err); } };

let drawn = false;
const pic = read() || { t: 0, ws: [] };
const fromLink = pic.ws.length > 0;
let hist = { t: 0, s: {}, b: [], l: [], p: [], e: [], g: [] };
// The link can name a view and a session ("Show in timeline"); else the page opens on the last view.
let view = VIEWS.some((v) => v[0] === pic.v) ? pic.v : stored("hive-view", "hive");
if (!VIEWS.some((v) => v[0] === view)) view = "hive";
let range = (RANGES.find((r) => r[0] === stored("hive-span", "auto")) || RANGES[0])[1];
const sel = pic.sel || "";
let live = false;
const when = document.getElementById("when");
const clock = (t) => (t ? new Date(t * 1000).toLocaleTimeString() : "now");
const JUMP = " The outlined box is the open tab. Click a session to go to its tab (the Agents panel must be open).";

function buttons(host, items, current, pick) {
  host.replaceChildren();
  for (const [id, label] of items) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", String(id === current));
    b.addEventListener("click", () => pick(id));
    host.appendChild(b);
  }
}
function show() {
  buttons(document.getElementById("nav"), VIEWS, view, (id) => { view = id; store("hive-view", id); show(); });
  const tools = document.getElementById("tools"), svg = svgRoot(), legend = document.getElementById("legend");
  tools.replaceChildren();
  legendItems = Object.values(STATUS);
  document.getElementById("head").textContent = "Agent hive" + (view === "hive" ? "" : " · " + VIEWS.find((v) => v[0] === view)[1]);
  if (view === "hive") {
    if (pic.ws.length === 0) {
      svg.replaceChildren();
      when.textContent = "No data yet. Open this page from the \"views\" link of the Agents panel in cmux, or start the watcher.";
    } else {
      when.textContent = live
        ? "Live: updated " + clock(pic.t) + ", again every 15 seconds." + JUMP + " Sessions of other tools keep the state from the moment the page opened."
        : "Fixed picture taken " + clock(pic.t) + ": no fresh data from the watcher." + JUMP + " Click \"views\" in the panel again for a new picture.";
      drawHive(pic);
      drawn = true;
    }
  } else {
    if (view === "timeline") {
      buttons(tools, RANGES.map((r) => [r[0], r[0]]), RANGES.find((r) => r[1] === range)[0],
        (id) => { range = RANGES.find((r) => r[0] === id)[1]; store("hive-span", id); show(); });
    }
    svg.replaceChildren();
    tileEnd = 0;
    when.textContent = VIEWS.find((v) => v[0] === view)[2](svg) + (hist.t ? " History up to " + clock(hist.t) + "." : "");
  }
  legend.replaceChildren();
  for (const [color, label] of legendItems) {
    const span = document.createElement("span"), dot = document.createElement("i");
    dot.style.background = color; span.appendChild(dot); span.appendChild(document.createTextNode(label)); legend.appendChild(span);
  }
}

// label-tabs.py writes hive-data.js and history-data.js, each as one call of a function of this page. A live
// file older than a minute means that the watcher stopped: the picture then stays as it is.
let fresh = false, build = null;
window.hiveLive = (raw) => {
  if (raw && Number.isFinite(raw.h) && raw.h > 0) {
    if (build === null) build = raw.h;
    else if (raw.h !== build) { location.reload(); return; }
  }
  const age = Math.abs(Date.now() / 1000 - (raw && Number.isFinite(raw.t) ? raw.t : 0));
  fresh = age < 60 && merge(pic, raw);
};
window.hiveHistory = (raw) => { hist = tidyHistory(raw) || hist; };
function load() {
  fresh = false;
  let left = 2;
  const done = (tag) => () => { tag.remove(); left -= 1; if (left === 0) { live = fresh; show(); } };
  for (const file of ["hive-data.js", "history-data.js"]) {
    const tag = document.createElement("script");
    tag.onload = done(tag);
    tag.onerror = done(tag);
    tag.src = file + "?" + Date.now();
    document.head.appendChild(tag);
  }
}

if (fromLink) show();
load();
setInterval(load, 15000);
window.addEventListener("resize", () => show());
</script>
