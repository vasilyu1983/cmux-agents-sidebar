<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent hive</title>
<!-- The hive graph of the cmux Agents panel. The panel opens this page with its data after "#" in the link:
     workspaces, their sessions, and the subagents of each session. Every 15 seconds the page also loads
     hive-data.js, a local file next to it that label-tabs.py writes, and brings the picture up to date.
     A switch at the top changes the view: Hive, Timeline, Cost, Limits, Queue, Context, Rhythm. Timeline, Limits,
     Queue and Rhythm also read history-data.js, the local history that label-tabs.py keeps (states, times, costs
     and limit figures; no request or reply text).
     It loads nothing from the network. It stores two words in the browser's local storage: the last view and the
     last time range. Every source passes a check (tidy, tidyHistory), and every text goes in with textContent,
     so a session title cannot add markup.
     The title of the page stays "Agent hive" in every view: the panel finds the page by it. -->
<style>
  :root { --bg: #f6f6f7; --fg: #1c1c1e; --dim: #6e6e73; --line: #c7c7cc; --card: #ffffff; }
  @media (prefers-color-scheme: dark) { :root { --bg: #1c1c1e; --fg: #f2f2f7; --dim: #98989d; --line: #48484a; --card: #2c2c2e; } }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 13px -apple-system, system-ui, sans-serif; }
  h1 { font-size: 15px; margin: 0 0 4px; }
  p { margin: 0 0 12px; color: var(--dim); }
  .wrap { overflow-x: auto; }
  svg text { fill: var(--fg); font: 12px -apple-system, system-ui, sans-serif; }
  svg text.sub { fill: var(--dim); font-size: 10px; }
  svg path { fill: none; stroke: var(--line); stroke-width: 1.2; }
  svg rect.box { fill: var(--card); stroke: var(--line); }
  svg g.here rect.box { stroke: #0A84FF; stroke-width: 2.2; fill: color-mix(in srgb, #0A84FF 16%, var(--card)); }
  svg g.go { cursor: pointer; }
  svg g.go:hover rect.box, svg g.go:focus rect.box { stroke: #0A84FF; stroke-width: 1.6; }
  svg g.go:focus { outline: none; }
  nav { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 10px; }
  nav button, #tools button { font: 600 12px -apple-system, system-ui, sans-serif; color: var(--dim); background: none; border: 0; border-radius: 6px; padding: 5px 10px; cursor: pointer; }
  nav button:hover, #tools button:hover { color: var(--fg); }
  nav button[aria-pressed="true"], #tools button[aria-pressed="true"] { background: var(--card); color: var(--fg); box-shadow: 0 0 0 1px var(--line); }
  nav button:focus-visible, #tools button:focus-visible { outline: 2px solid #0A84FF; }
  #tools { margin: 0 0 8px; min-height: 0; }
  svg text.big { font-size: 20px; font-weight: 600; }
  svg text.ink { fill: #111114; }
  svg line.grid { stroke: var(--line); stroke-width: 1; }
  svg .lane:hover rect.hit { fill: color-mix(in srgb, var(--fg) 6%, transparent); }
  .legend span { display: inline-block; margin-right: 14px; color: var(--dim); }
  .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 5px; }
</style>
</head>
<body>
<h1 id="head">Agent hive</h1>
<nav id="nav" aria-label="View"></nav>
<p id="when"></p>
<div id="tools"></div>
<div class="wrap"><svg id="g" xmlns="http://www.w3.org/2000/svg"></svg></div>
<p class="legend" id="legend"></p>
<script>
"use strict";
const STATUS = { needs_input: ["#FF9F0A", "needs you"], working: ["#0A84FF", "working"], idle: ["#34C759", "idle"] };
const NS = "http://www.w3.org/2000/svg";
const el = (name, attrs, text) => {
  const node = document.createElementNS(NS, name);
  for (const [k, v] of Object.entries(attrs || {})) node.setAttribute(k, String(v));
  if (text !== undefined) node.textContent = String(text);
  return node;
};
// One fixed colour per account name: the same list and the same sum as the Agents panel and the status line.
const ACCT_COLORS = ["#5fd7ff", "#af87ff", "#ff87d7", "#00d7af", "#d7d75f", "#5fafff"];
const acctColor = (name) => {
  let h = 0;
  for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) % 1000003;
  return ACCT_COLORS[h % ACCT_COLORS.length];
};
const cut = (text, n) => { const s = String(text ?? ""); return s.length > n ? s.slice(0, n - 1) + "…" : s; };

// Only known keys with the expected type pass. The link and the live file both go through here.
const text = (v, n) => (typeof v === "string" ? v.slice(0, n) : "");
const ident = (v) => (typeof v === "string" && /^[0-9A-Fa-f-]{1,40}$/.test(v) ? v.toUpperCase() : "");
function tidyAgent(a) {
  if (!a || typeof a !== "object") return null;
  const out = { n: text(a.n, 200), k: text(a.k, 40), s: text(a.s, 20), i: ident(a.i), w: ident(a.w), f: a.f === true,
    m: text(a.m, 60), x: Number.isFinite(a.x) ? a.x : null, c: text(a.c, 20), p: text(a.p, 60), l: text(a.l, 60), u: text(a.u, 16),
    q: Number.isFinite(a.q) ? a.q : 0 };
  if (Array.isArray(a.ch)) {
    out.ch = a.ch.slice(0, 40).filter((c) => c && typeof c === "object").map((c) => ({ n: text(c.n, 60), r: c.r === true }));
  }
  return out;
}
function tidy(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.ws)) return null;
  return {
    t: Number.isFinite(raw.t) ? raw.t : 0,
    v: text(raw.v, 12), sel: text(raw.sel, 60),
    ws: raw.ws.slice(0, 200).filter((w) => w && typeof w === "object").map((w) => ({
      n: text(w.n, 120), c: text(w.c, 9), w: ident(w.w), f: w.f === true,
      a: (Array.isArray(w.a) ? w.a : []).slice(0, 300).map(tidyAgent).filter(Boolean),
    })),
  };
}

function read() {
  try {
    return tidy(JSON.parse(decodeURIComponent(location.hash.slice(1))));
  } catch (err) {
    console.error("hive: the link carries no readable data", err);
    return null;
  }
}

// Brings the picture up to date from the live file. The file knows the Claude Code sessions, every tab id
// and the open tab. It does not know the state of other tools: their boxes keep the values from the link,
// and they go only when their tab goes.
function merge(pic, raw) {
  const live = tidy(raw);
  if (!live || !Array.isArray(raw.a) || !Array.isArray(raw.tabs)) return false;
  const tabs = new Set(raw.tabs.map(ident).filter(Boolean));
  const agents = raw.a.slice(0, 300).map(tidyAgent).filter((a) => a && a.i && a.w);
  for (const lw of live.ws) {
    if (!lw.w) continue;
    let w = pic.ws.find((x) => x.w === lw.w || x.a.some((a) => a.w === lw.w)) || pic.ws.find((x) => !x.w && x.a.length === 0 && x.n === lw.n);
    if (!w) { w = { n: lw.n, c: "", a: [] }; pic.ws.push(w); }
    w.w = lw.w; w.f = lw.f;
    if (lw.n) w.n = lw.n;
  }
  pic.ws = pic.ws.filter((w) => !w.w || live.ws.some((lw) => lw.w === w.w));
  for (const w of pic.ws) w.a = w.a.filter((a) => !a.i || tabs.has(a.i));
  const cur = ident(raw.cur);
  const known = cur && (agents.some((a) => a.i === cur) || pic.ws.some((w) => w.a.some((a) => a.i === cur)));
  for (const la of agents) {
    const w = pic.ws.find((x) => x.w === la.w);
    if (!w) continue;
    let a = null;
    for (const x of pic.ws) {
      const at = x.a.findIndex((y) => y.i === la.i);
      if (at >= 0) { a = x.a[at]; if (x !== w) { x.a.splice(at, 1); w.a.push(a); } break; }
    }
    if (!a) { a = { f: false }; w.a.push(a); }
    const keep = { f: a.f, ch: a.ch };
    Object.assign(a, la, { f: keep.f, ch: la.ch || keep.ch });
  }
  // The open tab moves the blue box only when it is a session's tab: this page itself is a tab too.
  if (known) for (const w of pic.ws) for (const a of w.a) a.f = a.i === cur;
  pic.t = live.t;
  return true;
}

// The page cannot call cmux. It puts the request in its title; the Agents panel reads tab titles and focuses
// the tab. The title returns after 5 seconds.
function jump(node, go) {
  const ask = () => {
    document.title = "go:" + go + ":" + Math.floor(Date.now() / 1000);
    setTimeout(() => { document.title = "Agent hive"; }, 5000);
  };
  node.addEventListener("click", ask);
  node.addEventListener("keydown", (e) => { if (e.key === "Enter") ask(); });
}

function drawHive(data) {
  const svg = document.getElementById("g");
  svg.replaceChildren();
  // A tree from left to right: hive, workspace, session, subagent. Each leaf takes one line of height.
  const W = [90, 190, 300, 200], GAP = 44, ROW = 40;
  const X = [0, W[0] + GAP, W[0] + W[1] + 2 * GAP, W[0] + W[1] + W[2] + 3 * GAP];
  let line = 0;
  const links = [], nodes = [];
  const place = (node, depth) => {
    const kids = node.kids || [];
    if (kids.length === 0) node.y = line++ * ROW + ROW / 2;
    else { for (const k of kids) place(k, depth + 1); node.y = (kids[0].y + kids[kids.length - 1].y) / 2; }
    node.depth = depth;
    nodes.push(node);
    for (const k of kids) links.push([node, k]);
  };
  const root = { title: "hive", sub: data.ws.length + " workspaces", color: "#8E8E93", kids: data.ws.map((w) => ({
    title: cut(w.n, 26), sub: (w.a || []).length + " session(s)" + (w.f ? " · current" : ""), here: w.f === true, color: /^#[0-9a-fA-F]{6,8}$/.test(w.c) ? w.c : "#8E8E93",
    kids: (w.a || []).map((a) => ({
      title: cut(a.n, 40), go: /^[0-9A-Fa-f-]{1,40}$/.test(a.i || "") && /^[0-9A-Fa-f-]{1,40}$/.test(a.w || "") ? a.w + ":" + a.i : "",
      sub: cut([a.u ? a.k + " " + a.u : a.k, a.m, a.x != null ? "ctx " + a.x + "%" : "", a.c, a.p].filter(Boolean).join(" · "), 52),
      // With an account, the same line in three parts, so the account name can carry its colour.
      kind: a.k, acct: a.u, rest: cut([a.m, a.x != null ? "ctx " + a.x + "%" : "", a.c, a.p].filter(Boolean).join(" · "), Math.max(0, 50 - (a.k + a.u).length)),
      here: a.f === true, color: (STATUS[a.s] || ["#8E8E93"])[0], hot: a.s === "needs_input" || a.x >= 80,
      kids: (a.ch || []).map((c) => ({ title: cut(c.n, 28), sub: c.r ? "running" : "done", color: c.r ? "#0A84FF" : "#8E8E93" })),
    })),
  })) };
  place(root, 0);
  svg.setAttribute("width", X[3] + W[3] + 8);
  svg.setAttribute("height", Math.max(line, 1) * ROW + 8);
  for (const [a, b] of links) {
    const x1 = X[a.depth] + W[a.depth], x2 = X[b.depth], mid = (x1 + x2) / 2;
    svg.appendChild(el("path", { d: `M${x1},${a.y} C${mid},${a.y} ${mid},${b.y} ${x2},${b.y}` }));
  }
  for (const n of nodes) {
    const x = X[n.depth], w = W[n.depth];
    const g = el("g", n.go ? { class: n.here ? "go here" : "go", tabindex: 0, role: "link" } : { class: n.here ? "here" : "" });
    g.appendChild(el("rect", { class: "box", x, y: n.y - 15, width: w, height: 30, rx: 7, style: n.hot ? "stroke:#FF9F0A;stroke-width:1.6" : "" }));
    g.appendChild(el("circle", { cx: x + 11, cy: n.y - 4, r: 4, fill: n.color }));
    g.appendChild(el("text", { x: x + 21, y: n.y }, n.title));
    const sub = el("text", { class: "sub", x: x + 21, y: n.y + 11 }, n.acct ? "" : n.sub);
    if (n.acct) {
      sub.appendChild(el("tspan", {}, n.kind + " "));
      sub.appendChild(el("tspan", { fill: acctColor(n.acct) }, n.acct));
      sub.appendChild(el("tspan", {}, n.rest ? " · " + n.rest : ""));
    }
    g.appendChild(sub);
    if (n.go) {
      // The page cannot call cmux. It puts the request in its title; the Agents panel reads tab titles and
      // focuses the tab. The title returns after 5 seconds.
      jump(g, n.go);
    }
    svg.appendChild(g);
    if (n.here && n.go && !drawn) setTimeout(() => g.scrollIntoView({ block: "center", inline: "nearest" }), 0);
  }
}

// ---- The history: what label-tabs.py keeps in history-data.js. Only known shapes pass. ----
const STATES = ["working", "needs_input", "idle"];
function tidyHistory(raw) {
  if (!raw || typeof raw !== "object" || !Array.isArray(raw.b)) return null;
  const s = {};
  for (const [sid, v] of Object.entries(raw.s && typeof raw.s === "object" ? raw.s : {}).slice(0, 2000)) {
    if (!/^[0-9a-f-]{8,64}$/.test(sid) || !v || typeof v !== "object") continue;
    s[sid] = { n: text(v.n, 60), w: text(v.w, 60), m: text(v.m, 40), x: Number.isFinite(v.x) ? v.x : null, c: text(v.c, 16), u: text(v.u, 16) };
  }
  const b = raw.b.slice(-20000).filter((x) => Array.isArray(x) && x.length === 4 && s[x[0]] && STATES.includes(x[1])
    && Number.isFinite(x[2]) && Number.isFinite(x[3]) && x[3] >= x[2]);
  const l = (Array.isArray(raw.l) ? raw.l : []).slice(-5000).filter((x) => Array.isArray(x) && x.length === 6
    && typeof x[0] === "string" && typeof x[1] === "string" && typeof x[2] === "string"
    && Number.isFinite(x[3]) && Number.isFinite(x[4]) && Number.isFinite(x[5]))
    .map((x) => [x[0].slice(0, 16), x[1].slice(0, 8), x[2].slice(0, 16), x[3], x[4], x[5]]);
  return { t: Number.isFinite(raw.t) ? raw.t : 0, s, b, l };
}

// ---- Shared helpers of the views ----
const svgRoot = () => document.getElementById("g");
const pageWidth = () => Math.max(640, Math.min(1500, document.documentElement.clientWidth - 32));
const dur = (sec) => {
  sec = Math.max(0, Math.round(sec));
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.round(sec / 60) + "m";
  const mins = Math.round(sec / 60), h = Math.floor(mins / 60), m = mins % 60;
  if (h >= 48) { const d = Math.floor(h / 24); return h % 24 ? d + "d " + (h % 24) + "h" : d + "d"; }
  return m ? h + "h " + m + "m" : h + "h";
};
const two = (n) => String(n).padStart(2, "0");
const hhmm = (t) => { const d = new Date(t * 1000); return two(d.getHours()) + ":" + two(d.getMinutes()); };
const dayTime = (t) => new Date(t * 1000).toLocaleDateString(undefined, { weekday: "short" }) + " " + hhmm(t);
const money = (c) => { const n = parseFloat(String(c ?? "").replace(/[^0-9.]/g, "")); return Number.isFinite(n) ? n : 0; };
const sessName = (title) => (/^\[([^\]]+)\]/.exec(String(title ?? "")) || [])[1] || "";
const agents = () => pic.ws.flatMap((w) => (w.a || []).map((a) => ({ ...a, wn: w.n, wc: w.c })));
const goOf = (a) => (a && /^[0-9A-Fa-f-]{1,40}$/.test(a.i || "") && /^[0-9A-Fa-f-]{1,40}$/.test(a.w || "") ? a.w + ":" + a.i : "");
// The box of an open session with this name, for a jump from a view that knows names only.
const agentNamed = (name) => (name ? agents().find((a) => sessName(a.n) === name) : null);
const empty = (svg, lines) => {
  svg.setAttribute("width", 640); svg.setAttribute("height", 30 + lines.length * 20);
  lines.forEach((line, k) => svg.appendChild(el("text", { class: k ? "sub" : "", x: 4, y: 24 + k * 20, style: k ? "font-size:12px" : "" }, line)));
};
const MODELS = [["opus", "#B79CFF", "Opus"], ["fable", "#4FD1C5", "Fable"], ["mythos", "#4FD1C5", "Mythos"], ["sonnet", "#6FB1FF", "Sonnet"],
  ["haiku", "#8FE0A6", "Haiku"], ["", "#B0B0B8", "other"]];
const modelOf = (m) => MODELS.find(([key]) => String(m ?? "").toLowerCase().includes(key));
const ctxColor = (x) => (x >= 80 ? "#FF6B61" : x >= 50 ? "#FFD60A" : "#34C759");
const TOOL_NAMES = { claude: "Claude", codex: "Codex", opencode: "OpenCode", grok: "Grok", agy: "Antigravity" };
let legendItems = [];

// A row of big figures at the top of a view: [value, label, colour]. Returns the height that it took.
function tiles(svg, items) {
  let x = 0;
  for (const [value, label, color] of items) {
    const w = Math.max(132, String(value).length * 14 + 34, String(label).length * 6.6 + 30);
    svg.appendChild(el("rect", { class: "box", x: x + 0.5, y: 0.5, width: w, height: 64, rx: 10, style: "stroke-opacity:.5" }));
    svg.appendChild(el("text", { x: x + 14, y: 30, style: "font-size:22px;font-weight:600" + (color ? ";fill:" + color : "") }, value));
    svg.appendChild(el("text", { class: "sub", x: x + 14, y: 50, style: "font-size:11px" }, label));
    x += w + 10;
  }
  return 80;
}
// One card of a list: a row with a background, as in the Context view.
const card = (y, w, h, marked) => el("rect", { class: "box", x: 0.5, y: y + 0.5, width: w - 1, height: h, rx: 9,
  style: marked ? "stroke:#0A84FF;stroke-width:1.6" : "stroke-opacity:.5" });
const track = (x, y, w, h) => el("rect", { x, y, width: Math.max(0, w), height: h, rx: h / 2, fill: "var(--bg)" });
// Shares of a length, where no part is smaller than min: the small parts grow, the others give the room.
function fit(values, length, min) {
  const sum = values.reduce((p, q) => p + q, 0), floor = Math.min(min, length / values.length);
  const small = values.filter((v) => (v / sum) * length < floor), rest = sum - small.reduce((p, q) => p + q, 0);
  return values.map((v) => ((v / sum) * length < floor ? floor : (v / rest) * (length - small.length * floor)));
}
const size = (svg, w, h) => { svg.setAttribute("width", w); svg.setAttribute("height", h); };

// ---- Timeline: one lane per session, one block per state ----
const RANGES = [["auto", 0], ["1h", 3600], ["6h", 21600], ["24h", 86400], ["7d", 604800]];
function drawTimeline(svg) {
  const now = hist.t || Math.floor(Date.now() / 1000);
  // "auto" fits the range to the history that exists, so a young history fills the picture.
  const first = hist.b.reduce((min, b) => Math.min(min, b[2]), now);
  const span = range || Math.min(604800, Math.max(900, Math.ceil((now - first) * 1.03)));
  const from = now - span;
  const lanes = new Map();
  for (const b of hist.b) {
    if (b[3] < from) continue;
    if (!lanes.has(b[0])) lanes.set(b[0], []);
    lanes.get(b[0]).push(b);
  }
  if (lanes.size === 0) {
    empty(svg, ["No history in this range yet.", "The watcher (label-tabs.py) adds to the history every 15 seconds while it runs.",
      "It covers Claude Code sessions: other tools publish no session state."]);
    return "Timeline: no data in the last " + dur(span) + ".";
  }
  // In each workspace: the open sessions first, then the closed ones (thin lanes).
  const rank = (sid) => hist.s[sid].w + "\n" + (agentNamed(hist.s[sid].n) ? 0 : 1) + hist.s[sid].n;
  const order = [...lanes.keys()].sort((a, b) => rank(a).localeCompare(rank(b)));
  const W = pageWidth(), LEFT = 210, RIGHT = 190, ROW = 36, GAP = 6, plot = W - LEFT - RIGHT;
  const x = (t) => LEFT + ((Math.max(t, from) - from) / span) * plot;
  const sums = order.map((sid) => {
    let w = 0, q = 0;
    for (const b of lanes.get(sid)) {
      const part = Math.min(b[3], now) - Math.max(b[2], from);
      if (b[1] === "working") w += part;
      if (b[1] === "needs_input") q += part;
    }
    return [w, q];
  });
  const worked = sums.reduce((s, v) => s + v[0], 0), waited = sums.reduce((s, v) => s + v[1], 0);
  const running = order.filter((sid) => { const l = lanes.get(sid); const b = l[l.length - 1]; return b[1] === "working" && now - b[3] < 60; }).length;
  let y = tiles(svg, [[dur(worked), "agents worked", STATUS.working[0]], [dur(waited), "waited for you", waited ? STATUS.needs_input[0] : ""],
    [String(running), "working now", ""], [String(order.length), "sessions", ""]]);
  // Time marks on round local times.
  const step = [60, 300, 600, 1800, 3600, 3 * 3600, 6 * 3600, 86400].find((s) => span / s <= 8) || 86400;
  const zone = new Date().getTimezoneOffset() * 60;
  const marks = [];
  for (let t = Math.ceil((from - zone) / step) * step + zone; t <= now; t += step) marks.push(t);
  for (const t of marks) {
    if (x(t) < LEFT + plot - 40) svg.appendChild(el("text", { class: "sub", x: x(t), y: y + 10, "text-anchor": "middle", style: "font-size:11px" },
      step >= 86400 ? new Date(t * 1000).toLocaleDateString(undefined, { weekday: "short" }) : hhmm(t)));
  }
  svg.appendChild(el("text", { class: "sub", x: LEFT + plot, y: y + 10, "text-anchor": "end", style: "font-size:11px;font-weight:600" }, "now"));
  svg.appendChild(el("text", { class: "sub", x: LEFT + plot + 18, y: y + 10, style: "font-size:11px" }, "worked"));
  svg.appendChild(el("text", { class: "sub", x: LEFT + plot + 96, y: y + 10, style: "font-size:11px" }, "waited for you"));
  y += 20;
  let group = null;
  order.forEach((sid, k) => {
    const info = hist.s[sid];
    if (info.w !== group) {
      group = info.w;
      y += k ? 10 : 0;
      svg.appendChild(el("text", { x: 2, y: y + 13, style: "font-size:12px;font-weight:700" }, cut(group || "no workspace", 40)));
      y += 22;
    }
    const live = agentNamed(info.n), go = goOf(live), [w, q] = sums[k], h = live ? ROW : 24, mid = y + h / 2, bh = live ? 18 : 10;
    const g = el("g", go ? { class: "go", tabindex: 0, role: "link" } : {});

// ---- Cost: a map (workspace, then session; the area is the cost) and a ranked list ----
function drawCost(svg) {
  const groups = pic.ws.map((w) => ({ n: w.n, a: (w.a || []).map((a) => ({ a, v: money(a.c) })).filter((x) => x.v > 0).sort((p, q) => q.v - p.v) }))

  const total = groups.reduce((sum, g) => sum + g.v, 0);
  if (total <= 0) {
    empty(svg, ["No cost figures yet.", "A Claude Code session reports its cost through the status line of this kit, after its first reply."]);
    return "Cost: no data.";
  }
  const all = groups.flatMap((g) => g.a.map((x) => ({ ...x, ws: g.n }))).sort((p, q) => q.v - p.v);
  const W = pageWidth(), H = 240, GAP = 4;
  let y = tiles(svg, [["$" + total.toFixed(2), "open sessions, list price", ""], ["$" + all[0].v.toFixed(2), "top: " + cut(sessName(all[0].a.n) || all[0].a.n, 20), modelOf(all[0].a.m)[1]],
    [Math.round((groups[0].v / total) * 100) + "%", "in " + cut(groups[0].n, 20), ""], [String(all.length), "sessions with a cost", ""]]);
  const widths = fit(groups.map((g) => g.v), W, 170);
  groups.forEach((g, k) => { g.gw = widths[k]; const hs = fit(g.a.map((x) => x.v), H, 28); g.a.forEach((x, j) => { x.h = hs[j]; }); });
  // The map. A box takes the tint of its model; the text keeps the page's ink, so it reads in light and dark.
  let x0 = 0;
  for (const g of groups) {
    const gw = g.gw;
    if (gw >= 60) svg.appendChild(el("text", { x: x0 + 2, y: y + 12, style: "font-size:12px;font-weight:700" }, cut(g.n, Math.floor(gw / 8))));
    if (gw >= 260) svg.appendChild(el("text", { class: "sub", x: x0 + gw - GAP - 2, y: y + 12, "text-anchor": "end", style: "font-size:11px" }, "$" + g.v.toFixed(2) + " · " + Math.round((g.v / total) * 100) + "%"));
    let y0 = y + 20;
    for (const { a, v, h } of g.a) {
      const model = modelOf(a.m), go = goOf(a), bw = Math.max(2, gw - GAP), bh = Math.max(2, h - GAP);
      const box = el("g", go ? { class: "go", tabindex: 0, role: "link" } : {});
      const rect = el("rect", { x: x0 + 0.5, y: y0 + 0.5, width: bw, height: bh, rx: Math.min(8, bh / 2),
        style: "fill:color-mix(in srgb, " + model[1] + " 24%, var(--card));stroke:" + model[1] + ";stroke-opacity:.75" });
      rect.appendChild(el("title", {}, a.n + " · " + (a.m || a.k) + " · " + a.c));
      box.appendChild(rect);
      if (bh >= 58 && bw >= 120) {
        box.appendChild(el("text", { x: x0 + 12, y: y0 + 30, style: "font-size:22px;font-weight:600" }, a.c));
        box.appendChild(el("text", { x: x0 + 12, y: y0 + 49, style: "font-size:12px;font-weight:600" }, cut(a.n, Math.floor((bw - 24) / 7.2))));
        if (bh >= 76) box.appendChild(el("text", { x: x0 + 12, y: y0 + 65, style: "font-size:11px;fill:" + model[1] }, cut(a.m || a.k, Math.floor((bw - 24) / 6.4))));
      } else if (bh >= 22 && bw >= 90) {
        box.appendChild(el("text", { x: x0 + 10, y: y0 + bh / 2 + 4.5, style: "font-size:12px;font-weight:600" }, cut(a.c + "  " + a.n, Math.floor((bw - 20) / 7))));
      }
      if (go) jump(box, go);
      svg.appendChild(box);
      y0 += h;

  // The ranked list: every session is readable here, also the ones that are thin lines in the map.
  const ROW = 34, LEFT = 330, RIGHT = 150, max = all[0].v, shown = all.slice(0, 30);
  svg.appendChild(el("text", { x: 2, y: y + 4, style: "font-size:12px;font-weight:700" }, "By session"));
  y += 14;
  for (const { a, v, ws } of shown) {
    const model = modelOf(a.m), go = goOf(a);
    const g = el("g", go ? { class: "go", tabindex: 0, role: "link" } : {});
    g.appendChild(card(y, W, ROW));
    g.appendChild(el("circle", { cx: 16, cy: y + 17.5, r: 4.5, fill: model[1] }));
    g.appendChild(el("text", { x: 30, y: y + 22, style: "font-size:13px;font-weight:600" }, cut(a.n, 26)));
    g.appendChild(el("text", { class: "sub", x: 222, y: y + 22, style: "font-size:11px" }, cut(ws, 15)));
    g.appendChild(track(LEFT, y + 12, W - LEFT - RIGHT, 11));
    g.appendChild(el("rect", { x: LEFT, y: y + 12, width: Math.max(4, (v / max) * (W - LEFT - RIGHT)), height: 11, rx: 5.5, fill: model[1] }));
    g.appendChild(el("text", { x: W - RIGHT + 14, y: y + 22, style: "font-size:13px;font-weight:600" }, a.c));
    g.appendChild(el("text", { class: "sub", x: W - 14, y: y + 22, "text-anchor": "end", style: "font-size:11px" }, Math.round((v / total) * 100) + "%"));
    if (go) jump(g, go);

  size(svg, W, y + 4);
  const seen = new Set(all.map((x) => modelOf(x.a.m)));
  legendItems = MODELS.filter((m) => seen.has(m) && m[0] !== "mythos").map((m) => [m[1], m[2]]);
  return "One column per workspace; the area of a box follows the cost of its session (a small box is enlarged to stay readable). Costs are estimates at list price. Click a box or a line to go to its tab.";
}

// ---- Limits: one card per limit window: the readings, and where the line goes ----
const WINDOW_SECS = { "5h": 18000, week: 604800 };
function drawLimits(svg) {
  const now = hist.t || Math.floor(Date.now() / 1000);
  const groups = new Map();
  for (const r of hist.l) {
    const key = r[0] + "|" + r[1] + "|" + r[2];
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(r);
  }
  const charts = [];
  for (const rows of groups.values()) {
    const reset = Math.max(...rows.map((r) => r[4]));
    if (reset <= now) continue;  // a window that ended, or one with no reset time
    const pts = rows.filter((r) => r[4] === reset).sort((p, q) => p[5] - q[5]);
    charts.push({ tool: pts[0][0], win: pts[0][1], acct: pts[0][2], reset, pts });
  }
  if (charts.length === 0) {
    empty(svg, ["No live limit window in the history yet.", "The watcher records each limit figure with its time. A tool that leaves no limit data cannot show here."]);
    return "Limits: no data.";
  }
  charts.sort((p, q) => (p.tool + p.acct + p.win).localeCompare(q.tool + q.acct + q.win));
  const W = pageWidth(), COLS = W >= 840 && charts.length > 1 ? 2 : 1, GAP = 12, CW = (W - (COLS - 1) * GAP) / COLS, CH = 244;
  const L = 46, R = 22, T = 98, B = 34, plotW = CW - L - R, plotH = CH - T - B;
  size(svg, W, Math.ceil(charts.length / COLS) * (CH + GAP));
  let risky = 0;
  charts.forEach((c, k) => {
    const left = (k % COLS) * (CW + GAP), top = Math.floor(k / COLS) * (CH + GAP), last = c.pts[c.pts.length - 1];
    const length = WINDOW_SECS[c.win] || Math.max(3600, c.reset - c.pts[0][5]);
    const start = c.reset - length;
    const x = (t) => left + L + (Math.min(Math.max(t, start), c.reset) - start) / length * plotW;
    const y = (v) => top + T + plotH - (Math.min(Math.max(v, 0), 100) / 100) * plotH;
    // The pace: from the readings when their span is long enough, else the average since the window opened.
    const first = c.pts.find((p) => last[5] - p[5] <= length / 4) || c.pts[0];
    // A share is a whole number, so a short span gives a wild pace: the span must be 2% of the window or more.
    const measured = last[5] - first[5] >= Math.max(600, length / 50);
    const rate = measured ? (last[3] - first[3]) / (last[5] - first[5]) : (last[5] > start ? last[3] / (last[5] - start) : 0);
    const hit = rate > 0 ? last[5] + (100 - last[3]) / rate : Infinity, hot = hit < c.reset;
    if (hot) risky += 1;
    const atReset = Math.min(100, Math.round(last[3] + Math.max(rate, 0) * (c.reset - last[5])));
    const color = last[3] >= 80 ? "#FF6B61" : last[3] >= 50 ? "#FF9F0A" : "#34C759";
    svg.appendChild(el("rect", { class: "box", x: left + 0.5, y: top + 0.5, width: CW - 1, height: CH, rx: 12, style: hot ? "stroke:#FF6B61;stroke-opacity:.8" : "stroke-opacity:.5" }));
    // The head of the card: the name, the share in big figures, and the verdict.
    const head = el("text", { x: left + 18, y: top + 26, style: "font-size:13px;font-weight:700" }, (TOOL_NAMES[c.tool] || c.tool) + " · " + c.win);
    if (c.acct) head.appendChild(el("tspan", { fill: acctColor(c.acct), style: "font-weight:600" }, "  " + c.acct));
    svg.appendChild(head);
    svg.appendChild(el("text", { x: left + 18, y: top + 62, style: "font-size:30px;font-weight:700;fill:" + color }, last[3] + "%"));
    svg.appendChild(el("text", { class: "sub", x: left + 18, y: top + 78, style: "font-size:11px" }, "used · resets in " + dur(c.reset - now)));
    const verdict = hot ? "100% " + dayTime(hit) : rate > 0 ? "about " + atReset + "% at the reset" : "no growth";
    const note = hot ? dur(c.reset - hit) + " before the reset" : (measured ? "pace of the last readings" : "average pace of this window");
    const vw = Math.max(verdict.length * 7.4 + 28, 150), vc = hot ? "#FF6B61" : "#34C759";
    svg.appendChild(el("rect", { x: left + CW - vw - 16, y: top + 16, width: vw, height: 28, rx: 14, style: "fill:color-mix(in srgb, " + vc + " 20%, var(--card));stroke:" + vc + ";stroke-opacity:.6" }));
    svg.appendChild(el("text", { x: left + CW - 16 - vw / 2, y: top + 35, "text-anchor": "middle", style: "font-size:13px;font-weight:600;fill:" + vc }, verdict));
    svg.appendChild(el("text", { class: "sub", x: left + CW - 18, y: top + 62, "text-anchor": "end", style: "font-size:11px" + (hot ? ";fill:#FF6B61" : "") }, note));
    // The plot: the passed part of the window has a tint.

    for (const v of [0, 50, 100]) {
      svg.appendChild(el("line", { class: "grid", x1: left + L, x2: left + L + plotW, y1: y(v), y2: y(v), style: "opacity:.6" }));
      svg.appendChild(el("text", { class: "sub", x: left + L - 7, y: y(v) + 3.5, "text-anchor": "end" }, v + "%"));
    }
    svg.appendChild(el("line", { x1: left + L, x2: left + L + plotW, y1: y(80), y2: y(80), style: "stroke:#FF6B61;stroke-dasharray:2 5;opacity:.75" }));
    // Before the first reading nothing is known: a faint line from 0% at the start of the window.

    svg.appendChild(el("path", { d: "M" + x(start) + "," + y(0) + " L" + line[0], style: "stroke:" + color + ";stroke-width:1.6;stroke-dasharray:1 4;stroke-linecap:round;opacity:.8" }));
    if (c.pts.length > 1) svg.appendChild(el("path", { d: "M" + line.join(" L"), style: "stroke-width:2.6;stroke-linejoin:round;stroke:" + color }));
    if (rate > 0) {
      const end = hot ? [hit, 100] : [c.reset, last[3] + rate * (c.reset - last[5])];
      svg.appendChild(el("path", { d: `M${x(last[5])},${y(last[3])} L${x(end[0])},${y(end[1])}`, style: "stroke-dasharray:6 5;stroke-width:2.2;stroke-linecap:round;stroke:" + (hot ? "#FF6B61" : "#98989d") }));
      if (hot) svg.appendChild(el("circle", { cx: x(hit), cy: y(100), r: 4.5, style: "fill:var(--card);stroke:#FF6B61;stroke-width:2.2" }));
    }
    svg.appendChild(el("line", { x1: x(now), x2: x(now), y1: y(100) - 4, y2: y(0), style: "stroke:var(--fg);stroke-width:1.2;opacity:.55" }));
    svg.appendChild(el("circle", { cx: x(last[5]), cy: y(last[3]), r: 5.5, style: "fill:" + color + ";stroke:var(--card);stroke-width:2" }));
    svg.appendChild(el("text", { class: "sub", x: left + L, y: top + CH - 12, style: "font-size:11px" }, dayTime(start)));
    if (x(now) > left + L + 90 && x(now) < left + L + plotW - 130) svg.appendChild(el("text", { x: x(now), y: top + CH - 12, "text-anchor": "middle", style: "font-size:11px;font-weight:600" }, "now"));
    svg.appendChild(el("text", { class: "sub", x: left + L + plotW, y: top + CH - 12, "text-anchor": "end", style: "font-size:11px" }, "reset " + dayTime(c.reset)));
  });
  legendItems = [["#34C759", "used so far"], ["#98989d", "forecast (dashed)"], ["#FF6B61", "reaches 100% before the reset"], ["#98989d", "dotted = no reading yet for that time"]];
  return (risky ? risky + " of " + charts.length + " limit windows reach 100% before the reset at this pace." : "No limit window reaches 100% before the reset at this pace.")
    + " The forecast is a straight line: it knows nothing about your plans.";
}

// ---- Queue: who waits for you, and for how long ----
function drawQueue(svg) {
  const now = hist.t || Math.floor(Date.now() / 1000);
  const newest = {};  // session name -> its newest block
  for (const b of hist.b) { const n = hist.s[b[0]].n; if (!newest[n] || b[3] >= newest[n][3]) newest[n] = b; }
  const rows = agents().filter((a) => a.s === "needs_input" || a.s === "idle").map((a) => {
    const b = newest[sessName(a.n)];
    return { a, since: b && b[1] === a.s && now - b[3] < 120 ? now - b[2] : -1 };
  }).sort((p, q) => (p.a.s === q.a.s ? q.since - p.since : p.a.s === "needs_input" ? -1 : 1));
  const W = Math.min(pageWidth(), 1100);
  const asks = rows.filter((r) => r.a.s === "needs_input"), longest = Math.max(-1, ...asks.map((r) => r.since));
  let y = tiles(svg, [[String(asks.length), asks.length === 1 ? "session asks you" : "sessions ask you", asks.length ? STATUS.needs_input[0] : ""],
    [longest >= 0 ? dur(longest) : "–", "longest wait for an answer", longest >= 600 ? STATUS.needs_input[0] : ""],
    [String(rows.length - asks.length), "ended a turn", rows.length - asks.length ? STATUS.idle[0] : ""]]);
  if (rows.length === 0) {
    svg.appendChild(el("text", { x: 2, y: y + 14, style: "font-size:13px" }, "Nothing waits for you. A session shows here when it asks you something or when it ended its turn."));
    size(svg, W, y + 30);
    return "Queue: nothing waits for you.";
  }
  const LEFT = 360, RIGHT = 110, ROW = 46, max = Math.max(60, ...rows.map((r) => r.since));
  let group = "";
  for (const r of rows) {
    const isAsk = r.a.s === "needs_input", go = goOf(r.a), color = STATUS[r.a.s][0];
    if (group !== r.a.s) {
      group = r.a.s;
      svg.appendChild(el("text", { x: 2, y: y + 12, style: "font-size:12px;font-weight:700;fill:" + color }, isAsk ? "Asks you" : "Ended its turn"));
      y += 22;
    }
    const g = el("g", go ? { class: "go", tabindex: 0, role: "link" } : {});
    g.appendChild(card(y, W, ROW));
    g.appendChild(el("rect", { x: 0.5, y: y + 8, width: 4, height: ROW - 15, rx: 2, fill: color }));
    g.appendChild(el("text", { x: 18, y: y + 20, style: "font-size:13px;font-weight:600" }, cut(r.a.n, 44)));
    g.appendChild(el("text", { class: "sub", x: 18, y: y + 36, style: "font-size:11px" }, cut([r.a.wn, r.a.m, r.a.u].filter(Boolean).join(" · "), 52)));
    g.appendChild(track(LEFT, y + 17, W - LEFT - RIGHT, 12));
    if (r.since >= 0) g.appendChild(el("rect", { x: LEFT, y: y + 17, width: Math.max(8, (r.since / max) * (W - LEFT - RIGHT)), height: 12, rx: 6, fill: color, opacity: isAsk ? 1 : 0.7 }));
    g.appendChild(el("text", { x: W - 16, y: y + 28, "text-anchor": "end", style: r.since < 0 ? "font-size:11px;opacity:.5" : "font-size:16px;font-weight:600" + (isAsk ? ";fill:" + color : "") },
      r.since < 0 ? "time unknown" : dur(r.since)));
    if (go) jump(g, go);
    svg.appendChild(g);
    y += ROW + 6;
  }
  size(svg, W, y + 4);
  legendItems = [[STATUS.needs_input[0], "asks you (permission or question)"], [STATUS.idle[0], "ended its turn"]];
  return "The longest wait is at the top of each group. Click a line to go to its tab.";
}

// ---- Context: one gauge per session ----
function drawContext(svg) {
  const rows = agents().filter((a) => a.x != null).sort((p, q) => q.x - p.x);
  if (rows.length === 0) {
    empty(svg, ["No context figures yet.", "A Claude Code session reports its context share through the status line of this kit."]);
    return "Context: no data.";
  }
  const W = pageWidth(), CW = 170, CH = 150, cols = Math.max(1, Math.floor(W / CW));
  svg.setAttribute("width", W); svg.setAttribute("height", Math.ceil(rows.length / cols) * CH + 6);
  const R = 46, arc = (cx, cy, share) => {
    // Three quarters of a circle, open at the bottom.
    const a0 = Math.PI * 0.75, a1 = a0 + Math.PI * 1.5 * Math.min(Math.max(share, 0.001), 1);
    return `M${cx + R * Math.cos(a0)},${cy + R * Math.sin(a0)} A${R},${R} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${cx + R * Math.cos(a1)},${cy + R * Math.sin(a1)}`;
  };
  rows.forEach((a, k) => {
    const cx = (k % cols) * CW + CW / 2, cy = Math.floor(k / cols) * CH + 60, go = goOf(a);
    const g = el("g", go ? { class: "go", tabindex: 0, role: "link" } : {});
    g.appendChild(el("rect", { class: "box", x: cx - CW / 2 + 5, y: cy - 56, width: CW - 10, height: CH - 8, rx: 9, style: "stroke-opacity:.5" }));
    g.appendChild(el("path", { d: arc(cx, cy, 1), style: "stroke-width:9;stroke-linecap:round;opacity:.55" }));
    g.appendChild(el("path", { d: arc(cx, cy, a.x / 100), style: "stroke-width:9;stroke-linecap:round;stroke:" + ctxColor(a.x) }));
    g.appendChild(el("text", { class: "big", x: cx, y: cy + 7, "text-anchor": "middle" }, a.x + "%"));
    g.appendChild(el("text", { class: "sub", x: cx, y: cy + 24, "text-anchor": "middle", style: a.q >= 10 ? "fill:#FFD60A" : "" }, a.q ? "⟳ " + a.q : ""));
    g.appendChild(el("text", { x: cx, y: cy + 60, "text-anchor": "middle", style: "font-weight:600" }, cut("[" + (sessName(a.n) || a.k) + "]", 20)));
    g.appendChild(el("text", { class: "sub", x: cx, y: cy + 75, "text-anchor": "middle" }, cut([a.wn, a.m].filter(Boolean).join(" · "), 26)));
    if (go) jump(g, go);
    svg.appendChild(g);
  });
  legendItems = [["#34C759", "under 50%"], ["#FFD60A", "50% and more"], ["#FF6B61", "80% and more: compact or start a new session"], ["#98989d", "⟳ = times the context was compacted"]];
  return "Share of the context window in use, fullest first. Click a gauge to go to its tab.";
}

// ---- Rhythm: when the agents worked, by hour and day ----
function drawRhythm(svg) {
  const now = hist.t || Math.floor(Date.now() / 1000), DAYS = 7;
  const midnight = new Date(now * 1000); midnight.setHours(0, 0, 0, 0);
  const day0 = midnight.getTime() / 1000 - (DAYS - 1) * 86400;
  const cells = Array.from({ length: DAYS }, () => new Array(24).fill(0));
  for (const b of hist.b) {
    if (b[1] !== "working") continue;
    // Each block is cut at the hour marks; a cell sums the seconds of all sessions.
    for (let t = Math.max(b[2], day0); t < b[3];) {
      const d = new Date(t * 1000), next = Math.min(b[3], new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours() + 1).getTime() / 1000);
      const row = Math.floor((new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 1000 - day0) / 86400 + 0.5);
      if (row >= 0 && row < DAYS) cells[row][d.getHours()] += next - t;
      t = next;
    }
  }
  const flat = cells.flat(), max = Math.max(...flat), total = flat.reduce((p, q) => p + q, 0);
  if (!max) {
    empty(svg, ["No working time in the history yet.", "This view fills over some days: it shows the hours in which your agents work."]);
    return "Rhythm: no data.";
  }
  const best = flat.indexOf(max), bestDay = new Date((day0 + Math.floor(best / 24) * 86400 + 43200) * 1000);
  const today = cells[DAYS - 1].reduce((p, q) => p + q, 0), active = cells.filter((row) => row.some(Boolean)).length;
  const top = tiles(svg, [[dur(total), "agent work, 7 days", STATUS.working[0]], [dur(today), "today", ""],
    [two(best % 24) + ":00", "busiest hour, " + bestDay.toLocaleDateString(undefined, { weekday: "short" }) + " (" + dur(max) + ")", ""],
    [active + " of " + DAYS, "days with history", ""]]);
  const W = pageWidth(), LEFT = 104, RIGHT = 84, CW = Math.min(46, (W - LEFT - RIGHT) / 24), row0 = cells.findIndex((row) => row.some(Boolean)),
    CHH = DAYS - row0 <= 2 ? 60 : 34, TOP = top + 22, hourNow = new Date(now * 1000).getHours();
  size(svg, LEFT + 24 * CW + RIGHT, TOP + (DAYS - row0) * CHH + 8);
  for (let h = 0; h < 24; h += 2) svg.appendChild(el("text", { class: "sub", x: LEFT + h * CW + (CW - 4) / 2, y: top + 12, "text-anchor": "middle", style: "font-size:11px" }, two(h)));
  cells.forEach((row, r) => {
    const date = new Date((day0 + r * 86400 + 43200) * 1000), y = TOP + (r - row0) * CHH, isToday = r === DAYS - 1, base = y + (CHH - 4) / 2 + 4;
    if (r < row0) return;
    svg.appendChild(el("text", { x: 2, y: base, style: "font-size:12px;" + (isToday ? "font-weight:700" : "opacity:.7") },
      isToday ? "Today" : date.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" })));
    row.forEach((v, h) => {
      const share = v / max;
      const rect = el("rect", { x: LEFT + h * CW, y, width: CW - 4, height: CHH - 4, rx: 6,
        style: v ? "fill:color-mix(in srgb, #0A84FF " + Math.round(30 + 70 * share) + "%, var(--card))" : "fill:var(--card);opacity:.6" });
      rect.appendChild(el("title", {}, two(h) + ":00 · " + (v ? dur(v) + " of agent work" : "no work")));
      svg.appendChild(rect);
      if (v && CW >= 28) svg.appendChild(el("text", { x: LEFT + h * CW + (CW - 4) / 2, y: base - 0.5, "text-anchor": "middle", style: "font-size:10px;font-weight:600;fill:#fff;pointer-events:none" }, dur(v).replace(" ", "")));
      if (isToday && h === hourNow) svg.appendChild(el("rect", { x: LEFT + h * CW - 1.5, y: y - 1.5, width: CW - 1, height: CHH - 1, rx: 7.5, style: "fill:none;stroke:var(--fg);stroke-width:1.5" }));
    });
    const sum = row.reduce((p, q) => p + q, 0);
    svg.appendChild(el("text", { x: LEFT + 24 * CW + 10, y: base, style: "font-size:12px;font-weight:600" + (sum ? "" : ";opacity:.3") }, sum ? dur(sum) : "–"));
  });
  legendItems = [["#0A84FF", "stronger blue = more agent work in that hour"], ["#98989d", "the outlined cell is the current hour"]];
  return "Agent work per hour, last " + DAYS + " days, Claude Code sessions. Two agents that work in one hour count twice."
    + (row0 ? " The history started " + (DAYS - row0 === 1 ? "today" : (DAYS - row0) + " days ago") + ": earlier days are not shown." : "");
}

// ---- The switch and the page loop ----
const VIEWS = [["hive", "Hive", null], ["timeline", "Timeline", drawTimeline], ["cost", "Cost", drawCost], ["limits", "Limits", drawLimits],
  ["queue", "Queue", drawQueue], ["context", "Context", drawContext], ["rhythm", "Rhythm", drawRhythm]];
const stored = (key, fallback) => { try { return localStorage.getItem(key) || fallback; } catch (err) { return fallback; } };
const store = (key, value) => { try { localStorage.setItem(key, value); } catch (err) { console.warn("hive: the view is not remembered", err); } };

let drawn = false;
const pic = read() || { t: 0, ws: [] };
const fromLink = pic.ws.length > 0;
let hist = { t: 0, s: {}, b: [], l: [] };
// The link can name a view and a session ("Show in timeline"); else the page opens on the last view.
let view = VIEWS.some((v) => v[0] === pic.v) ? pic.v : stored("hive-view", "hive");
if (!VIEWS.some((v) => v[0] === view)) view = "hive";
let range = (RANGES.find((r) => r[0] === stored("hive-span", "auto")) || RANGES[0])[1];
const sel = pic.sel || "";
let live = false;
const when = document.getElementById("when");
const clock = (t) => (t ? new Date(t * 1000).toLocaleTimeString() : "now");
const JUMP = " The blue box is the open tab. Click a session to go to its tab (the Agents panel must be open).";

function buttons(host, items, current, pick) {
  host.replaceChildren();
  for (const [id, label] of items) {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = label; b.setAttribute("aria-pressed", String(id === current));
    b.addEventListener("click", () => pick(id));
    host.appendChild(b);
  }
}
function show() {
  buttons(document.getElementById("nav"), VIEWS, view, (id) => { view = id; store("hive-view", id); show(); });
  const tools = document.getElementById("tools"), svg = svgRoot(), legend = document.getElementById("legend");
  tools.replaceChildren();
  legendItems = Object.values(STATUS);
  document.getElementById("head").textContent = "Agent hive" + (view === "hive" ? "" : " · " + VIEWS.find((v) => v[0] === view)[1]);
  if (view === "hive") {
    if (pic.ws.length === 0) {
      svg.replaceChildren();
      when.textContent = "No data yet. Open this page from the \"views\" link of the Agents panel in cmux, or start the watcher.";
    } else {
      when.textContent = live
        ? "Live: updated " + clock(pic.t) + ", again every 15 seconds." + JUMP + " Sessions of other tools keep the state from the moment the page opened."
        : "Fixed picture taken " + clock(pic.t) + ": no fresh data from the watcher." + JUMP + " Click \"views\" in the panel again for a new picture.";
      drawHive(pic);
      drawn = true;
    }
  } else {
    if (view === "timeline") {
      buttons(tools, RANGES.map((r) => [r[0], r[0]]), RANGES.find((r) => r[1] === range)[0],
        (id) => { range = RANGES.find((r) => r[0] === id)[1]; store("hive-span", id); show(); });
    }
    svg.replaceChildren();
    when.textContent = VIEWS.find((v) => v[0] === view)[2](svg) + (hist.t ? " History up to " + clock(hist.t) + "." : "");
  }
  legend.replaceChildren();
  for (const [color, label] of legendItems) {
    const span = document.createElement("span"), dot = document.createElement("i");
    dot.style.background = color; span.appendChild(dot); span.appendChild(document.createTextNode(label)); legend.appendChild(span);
  }
}

// label-tabs.py writes hive-data.js and history-data.js, each as one call of a function of this page. A live
// file older than a minute means that the watcher stopped: the picture then stays as it is.
let fresh = false;
window.hiveLive = (raw) => {
  const age = Math.abs(Date.now() / 1000 - (raw && Number.isFinite(raw.t) ? raw.t : 0));
  fresh = age < 60 && merge(pic, raw);
};
window.hiveHistory = (raw) => { hist = tidyHistory(raw) || hist; };
function load() {
  fresh = false;
  let left = 2;
  const done = (tag) => () => { tag.remove(); left -= 1; if (left === 0) { live = fresh; show(); } };
  for (const file of ["hive-data.js", "history-data.js"]) {
    const tag = document.createElement("script");
    tag.onload = done(tag);
    tag.onerror = done(tag);
    tag.src = file + "?" + Date.now();
    document.head.appendChild(tag);
  }
}

if (fromLink) show();
load();
setInterval(load, 15000);
window.addEventListener("resize", () => show());
</script>
</body>
