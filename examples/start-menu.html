<!-- Source of examples/start-menu.png: a drawing of the start menu (right-click on a workspace header), sample names only.
     Render: headless Chrome, window size 420x(height of the picture), device scale factor 2. -->
<html lang="en"><head><meta charset="utf-8"><title>Start menu, sample names</title>
<style>
  html, body { margin: 0; background: #2b2b2b; }
  body { width: 420px; height: 330px; padding: 18px 14px 0; box-sizing: border-box; font: 13px -apple-system, "Helvetica Neue", Arial, sans-serif; color: #e8e8ea; position: relative; overflow: hidden; }
  .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  .band { display: flex; align-items: center; gap: 7px; margin: 0 10px; padding: 7px 10px; border-radius: 8px; background: #3b8cff26; color: #8ab8ff; font-weight: 600; font-size: 13px; }
  .band i { width: 4px; height: 14px; border-radius: 2px; background: #5a9bff; }
  .band .r { margin-left: auto; font-weight: 400; font-size: 11px; color: #b4b4ba; display: flex; gap: 10px; }
  .menu { position: absolute; background: #3c3c3ee6; border: 1px solid #5a5a5e; border-radius: 10px; padding: 5px; box-shadow: 0 10px 28px #00000099; font-size: 13px; }
  .it { display: flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 5px; white-space: nowrap; }
  .it .ch { margin-left: auto; padding-left: 14px; color: #a8a8ad; font-size: 11px; }
  .it.on { background: #0a64d6; color: #fff; }
  .it.on .ch { color: #fff; }
  .it .star { color: #a8a8ad; font-size: 11px; }
  .it.on .star { color: #cfe2ff; }
  .hd { height: 20px; padding: 0 8px; display: flex; align-items: center; color: #8e8e93; font-size: 11px; }
  .sep { height: 1px; background: #ffffff1f; margin: 4px 6px; }
</style></head>
<body>
  <div class="band"><span class="mono" style="font-size:9px;color:#b4b4ba">▾</span><i></i>web-shop<span class="r mono"><span>3 · $24</span><span style="color:#b4b4ba">+</span></span></div>

  <div class="menu" style="left:24px;top:56px;width:180px">
    <div class="it">⚪  Terminal</div>
    <div class="sep"></div>
    <div class="hd">Agent session</div>
    <div class="it on">🟠  Claude<span class="ch">›</span></div>
    <div class="it">🟢  Codex<span class="ch">›</span></div>
    <div class="it">🔵  OpenCode</div>
    <div class="it">🔴  Grok</div>
    <div class="it">🟣  Antigravity</div>
    <div class="it">⚫  Gemini CLI</div>
    <div class="it">⚫  Kiro CLI</div>
    <div class="sep"></div>
    <div class="it">Add account<span class="ch">›</span></div>
  </div>

  <div class="menu" style="left:202px;top:104px;width:190px">
    <div class="it">personal  <span class="star">★ default</span></div>
    <div class="sep"></div>
    <div class="it">work</div>
  </div>
</body></html>
